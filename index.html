    <table><thead><tr><th>任務名稱</th><th>點數</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan=3 class="empty">尚無額外任務</td></tr>'}</tbody></table>
    <div class="row-flex" style="margin-top:14px;">
      <div><label>任務名稱</label><input type="text" value="${esc(state.addBonusDraft.name)}" oninput="state.addBonusDraft.name=this.value" placeholder="例如：熟讀一本課外書"></div>
      <div style="max-width:120px;"><label>獎勵點數</label><input type="number" value="${state.addBonusDraft.points}" oninput="state.addBonusDraft.points=this.value"></div>
      <div style="flex:0;"><button class="btn gold" onclick="addBonusTask()">新增任務</button></div>
    </div>`;
  } else if(state.coachTab==='questions'){
    let rows = state.config.questions.map(q=>{
      const tagItem = state.config.items.find(it=>it.id===q.tag);
      const tagLabel = tagItem ? (esc(tagItem.name) + (q.subTag?(' › '+esc(q.subTag)):'')) : '不指定';
      return `<tr><td>${esc(q.q)}</td><td>${esc(q.options[q.correct])}</td><td>${tagLabel}</td><td><button class="btn secondary small" onclick="deleteQuestion('${q.id}')">刪除</button></td></tr>`;
    }).join('');
    let itemOptions = state.config.items.map(it=>`<option value="${it.id}" ${state.addQDraft.tag===it.id?'selected':''}>${esc(it.name)}</option>`).join('');
    let optInputs = state.addQDraft.options.map((o,i)=>`
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
        <input type="radio" name="correctOpt" ${state.addQDraft.correct==i?'checked':''} onchange="state.addQDraft.correct=${i}" style="width:auto;">
        <input type="text" value="${esc(o)}" oninput="state.addQDraft.options[${i}]=this.value" placeholder="選項 ${i+1}">
      </div>`).join('');
    const selectedItem = state.config.items.find(it=>it.id===state.addQDraft.tag);
    const subChoices = selectedItem ? (selectedItem.subOptions||[]).map(o=>o.label).filter(l=>l!=='自訂內容') : [];
    let subTagHtml = '';
    if(subChoices.length){
      subTagHtml = `<div><label>對應內容選項（可選，設定後這題只會在學生做這個細項時出現）</label>
        <select onchange="state.addQDraft.subTag=this.value">
          <option value="">不指定（整個項目共用）</option>
          ${subChoices.map(o=>`<option value="${esc(o)}" ${state.addQDraft.subTag===o?'selected':''}>${esc(o)}</option>`).join('')}
        </select>
      </div>`;
    }
    body = `
    <div class="panel" style="background:var(--bg-panel-2);margin-bottom:14px;">
      <div class="small-note" style="margin-bottom:8px;">教練提供的「棒球認知測驗」選擇題（5 題）可以直接匯入題庫，不會動到你原本的項目或其他題目。</div>
      <button class="btn secondary" onclick="importExamQuestions()">📥 匯入棒球認知測驗選擇題</button>
    </div>
    <div class="panel" style="background:var(--bg-panel-2);margin-bottom:14px;">
      <div class="small-note" style="margin-bottom:8px;">依照你提供的「記錄符號表」整理出的 16 題選擇題（守備位置代號、記錄符號 BB/HR/SB/FC 等），可以直接匯入題庫，不會動到你原本的項目或其他題目。</div>
      <button class="btn secondary" onclick="importScorekeepingQuestions()">📥 匯入棒球記錄符號選擇題（16題）</button>
    </div>
    <div class="small-note" style="margin-bottom:14px;">📌 地理科題目已經獨立成「試煉之路」自己的題庫，不會出現在這裡，也不會混進 Boss 戰鬥的題目池。請到「試煉之路題庫」分頁管理。</div>
    <table><thead><tr><th>題目</th><th>正解</th><th>對應項目</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan=4 class="empty">尚無題目</td></tr>'}</tbody></table>
    <div class="panel" style="background:var(--bg-panel-2);margin-top:14px;">
      <label>題目內容</label>
      <textarea rows="2" oninput="state.addQDraft.q=this.value" placeholder="例如：打擊時重心應該放在？">${esc(state.addQDraft.q)}</textarea>
      <div style="margin-top:10px;">
        <label>四個選項（選擇左側圓點標記正確答案）</label>
        ${optInputs}
      </div>
      <div class="row-flex" style="margin-top:10px;">
        <div><label>對應練習項目（可不指定）</label>
          <select onchange="state.addQDraft.tag=this.value; state.addQDraft.subTag=''; render();">
            <option value="">不指定</option>
            ${itemOptions}
          </select>
        </div>
        ${subTagHtml}
        <div style="flex:0;"><button class="btn gold" onclick="addQuestion()">新增題目</button></div>
      </div>
    </div>`;
  } else {
    if(overviewCache.length===0 && state.players.length>0){ refreshOverview(); }
    const boss = state.teamBoss || {name:'烈焰黑龍', emoji:'🐉', quote:'「膽敢挑戰本座？」', hp:0, maxHp:1, bossNumber:1, kills:[]};
    const bossPct = Math.max(0, Math.round(boss.hp/boss.maxHp*100));
    const bossKills = (boss.kills||[]).slice(0,5).map(k=>`<div class="small-note">${esc(k.date)} · 最後一擊：${esc(k.by)}</div>`).join('');
    let rows = overviewCache.map(p=>{
      const acc = (p.correct+p.wrong)>0 ? Math.round(p.correct/(p.correct+p.wrong)*100) : 0;
      const ch = characterById(p.avatarId);
      return `<tr>
        <td><img src="${ch.image}" style="width:32px;height:32px;image-rendering:pixelated;border-radius:6px;" title="${esc(ch.name)}"></td>
        <td>${esc(p.name)}</td>
        <td>${esc(p.realName||'—')}</td>
        <td>Lv.${p.level}</td>
        <td>${p.energy}</td>
        <td>${p.points}</td>
        <td>${p.streak}🔥</td>
        <td>${acc}%</td>
        <td style="min-width:280px;">
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <input type="number" placeholder="⚡能量+/-" style="width:80px;" value="${state.energyAdjustDraft[p.name]||''}" oninput="state.energyAdjustDraft['${esc(p.name)}']=this.value">
            <button class="btn secondary small" onclick="adjustEnergy('${esc(p.name)}')">調整能量</button>
            <input type="number" placeholder="點數" style="width:70px;" value="${state.redeemDraft[p.name]||''}" oninput="state.redeemDraft['${esc(p.name)}']=this.value">
            <button class="btn secondary small" onclick="redeemPoints('${esc(p.name)}')">兌換</button>
            <button class="btn secondary small" onclick="viewPlayerLog('${esc(p.name)}')">查看紀錄</button>
            <button class="btn secondary small" style="color:var(--accent-red);" onclick="deletePlayer('${esc(p.name)}')">🗑️ 刪除</button>
          </div>
        </td>
      </tr>`;
    }).join('');
    const rosterOptions = (state.config.bossRoster||DEFAULT_BOSS_ROSTER).map(t=>`<option value="${t.id}" ${boss.templateId===t.id?'selected':''}>${t.emoji?t.emoji+' ':(t.image?'🖼️ ':'')}${esc(t.name)}</option>`).join('');
    body = `
    <div class="panel battle-card" style="margin-top:0;">
      ${monsterVisualHtml(boss)}
      <div class="monster-name">${esc(boss.name)}（Boss #${boss.bossNumber}）</div>
      <div class="small-note" style="font-style:italic;">${esc(boss.quote||'')}</div>
      <div class="hp-bar-outer"><div class="hp-bar-inner" style="width:${bossPct}%;"></div></div>
      <div class="hp-text">全隊共同 HP ${boss.hp} / ${boss.maxHp}</div>
      ${bossKills ? `<div style="margin-top:10px;"><div class="small-note" style="font-weight:600;">最近擊殺紀錄</div>${bossKills}</div>` : ''}
      <div class="row-flex" style="margin-top:12px;align-items:flex-end;">
        <div><label>選擇目前 Boss 造型</label>
          <select onchange="applyBossTemplate(this.value)">${rosterOptions}</select>
        </div>
        <div style="max-width:120px;"><label>Boss 閃避機率(%)</label><input type="number" value="${state.bossDodgeDraft!==null?state.bossDodgeDraft:Math.round((state.config.bossDodgeChance!=null?state.config.bossDodgeChance:0.2)*100)}" oninput="state.bossDodgeDraft=this.value"></div>
        <div style="max-width:130px;"><label>每次攻擊消耗能量</label><input type="number" value="${state.attackCostDraft!==null?state.attackCostDraft:(state.config.attackEnergyCost!=null?state.config.attackEnergyCost:1)}" oninput="state.attackCostDraft=this.value"></div>
        <div style="max-width:130px;"><label>必殺技傷害值</label><input type="number" value="${state.ultimateDmgDraft!==null?state.ultimateDmgDraft:(state.config.ultimateDamage!=null?state.config.ultimateDamage:100)}" oninput="state.ultimateDmgDraft=this.value"></div>
        <div style="flex:0;"><button class="btn secondary small" onclick="saveBossDodgeChance()">儲存</button></div>
        <div style="flex:0;"><button class="btn secondary small" onclick="resetTeamBoss()">🔄 重置 Boss</button></div>
      </div>
    </div>
    <div class="flex-between" style="margin:14px 0 10px;">
      <div class="small-note">共 ${state.players.length} 位球員 ・ 資料為團隊共享，所有裝置即時同步</div>
      <button class="btn secondary small" onclick="refreshOverview()">重新整理</button>
    </div>
    <table><thead><tr><th>角色</th><th>暱稱／ID</th><th>本名</th><th>等級</th><th>能量</th><th>點數</th><th>連續</th><th>正確率</th><th>兌換</th></tr></thead>
    <tbody>${rows || '<tr><td colspan=9 class="empty">尚無球員資料</td></tr>'}</tbody></table>
    <div class="small-note" style="margin-top:12px;">${esc(state.config.rewardNote)}</div>`;
  }

  return `
  <div class="panel">
    <div class="tabs">
      <div class="tab ${state.coachTab==='items'?'active':''}" onclick="setCoachTab('items')">項目管理</div>
      <div class="tab ${state.coachTab==='shop'?'active':''}" onclick="setCoachTab('shop')">商店管理</div>
      <div class="tab ${state.coachTab==='bossroster'?'active':''}" onclick="setCoachTab('bossroster')">Boss 設定</div>
      <div class="tab ${state.coachTab==='skills'?'active':''}" onclick="setCoachTab('skills')">技能設定</div>
      <div class="tab ${state.coachTab==='classtiers'?'active':''}" onclick="setCoachTab('classtiers')">職業設定</div>
      <div class="tab ${state.coachTab==='geoquestions'?'active':''}" onclick="setCoachTab('geoquestions')">試煉之路題庫</div>
      <div class="tab ${state.coachTab==='journals'?'active':''}" onclick="setCoachTab('journals')">訓練日誌總覽</div>
      <div class="tab ${state.coachTab==='bonus'?'active':''}" onclick="setCoachTab('bonus')">額外任務</div>
      <div class="tab ${state.coachTab==='questions'?'active':''}" onclick="setCoachTab('questions')">題庫管理</div>
      <div class="tab ${state.coachTab==='overview'?'active':''}" onclick="setCoachTab('overview')">隊伍總覽</div>
    </div>
    ${body}
  </div>`;
}

function setRole(r){
  if(r==='coach' && !state.coachUnlocked){ openCoachLogin(); return; }
  state.role=r;
  if(r==='coach'){ overviewCache=[]; }
  render();
}
function setCoachTab(t){ state.coachTab=t; if(t==='overview'){ overviewCache=[]; } if(t==='journals'){ journalsCache=[]; } render(); }

function openCoachLogin(){
  state.showCoachLogin = true;
  state.coachPwDraft = '';
  render();
}
function closeCoachLogin(){
  state.showCoachLogin = false;
  render();
}
async function submitCoachLogin(){
  const pw = state.coachPwDraft || '';
  if(!state.config.coachPassword){
    // 第一次使用，還沒設定過密碼：直接把輸入的內容設為新密碼
    if(!pw.trim()){ showToast('請設定一組教練密碼'); return; }
    state.config.coachPassword = pw;
    await saveConfig(state.config);
    state.coachUnlocked = true;
    state.showCoachLogin = false;
    state.role = 'coach';
    showToast('已設定教練密碼，之後用這組密碼登入教練模式');
    render();
    return;
  }
  if(pw === state.config.coachPassword){
    state.coachUnlocked = true;
    state.showCoachLogin = false;
    state.role = 'coach';
    render();
  } else {
    showToast('密碼不對喔');
  }
}
async function changeCoachPassword(){
  const pw = (state.newCoachPwDraft||'').trim();
  if(!pw){ showToast('請輸入新密碼'); return; }
  state.config.coachPassword = pw;
  await saveConfig(state.config);
  state.newCoachPwDraft = '';
  showToast('教練密碼已更新');
  render();
}

init();
</script>
</body>
</html>
