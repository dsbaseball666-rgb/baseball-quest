<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訓練競技場 · 每日練習打怪</title>
<style>
  :root{
    --bg-deep:#0B1626;
    --bg-panel:#132038;
    --bg-panel-2:#1B2C4C;
    --line:#2A3D63;
    --accent-light:#FFD166;
    --accent-red:#E4572E;
    --accent-green:#2A9D8F;
    --text-chalk:#F2EFE9;
    --text-dim:#8FA0C2;
    --font-display:'Teko','Oswald',sans-serif;
    --font-body:'Rubik','Noto Sans TC',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&display=swap');
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,209,102,0.08), transparent 60%),
      var(--bg-deep);
    color:var(--text-chalk);
    font-family:var(--font-body);
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px;}

  /* ---- header / scoreboard bar ---- */
  .scoreboard{
    background:linear-gradient(180deg,#0E1930,#0A1424);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 22px;
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;
    position:relative;
    overflow:hidden;
  }
  .scoreboard::before{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(90deg, rgba(255,209,102,0.05) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .scoreboard h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:34px;
    letter-spacing:0.5px;
    margin:0;
    color:var(--accent-light);
    text-shadow:0 0 18px rgba(255,209,102,0.35);
  }
  .scoreboard .sub{font-size:12px;color:var(--text-dim);font-family:var(--font-mono);letter-spacing:1px;text-transform:uppercase;}
  .role-toggle{display:flex;gap:8px;z-index:1;}
  .role-btn{
    font-family:var(--font-mono);font-size:13px;letter-spacing:0.5px;
    padding:9px 16px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg-panel);color:var(--text-dim);cursor:pointer;
    transition:all .15s ease;
  }
  .role-btn.active{background:var(--accent-red);color:#fff;border-color:var(--accent-red);}
  .role-btn:hover{border-color:var(--accent-light);}

  /* ---- generic panel ---- */
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    margin-top:16px;
  }
  .panel h2{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0 0 14px;color:var(--text-chalk);letter-spacing:0.3px;}
  .panel h2 .eyebrow{display:block;font-family:var(--font-mono);font-size:11px;color:var(--accent-green);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}

  .btn{
    font-family:var(--font-body);font-weight:500;font-size:14px;
    padding:10px 18px;border-radius:8px;border:none;cursor:pointer;
    background:var(--accent-red);color:#fff;transition:transform .1s ease, filter .15s ease;
  }
  .btn:hover{filter:brightness(1.1);}
  .btn:active{transform:scale(0.97);}
  .btn:disabled{background:#3A4A6B;color:var(--text-dim);cursor:not-allowed;}
  .btn.secondary{background:var(--bg-panel-2);color:var(--text-chalk);border:1px solid var(--line);}
  .btn.gold{background:var(--accent-light);color:#3A2400;}
  .btn.small{padding:6px 12px;font-size:12px;}

  input[type=text], input[type=number], select, textarea{
    background:var(--bg-deep);border:1px solid var(--line);color:var(--text-chalk);
    padding:9px 12px;border-radius:8px;font-family:var(--font-body);font-size:14px;width:100%;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent-green);border-color:transparent;}
  label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:5px;}

  /* ---- tabs (coach) ---- */
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{
    font-family:var(--font-mono);font-size:12px;padding:8px 14px;border-radius:20px;
    background:var(--bg-panel-2);color:var(--text-dim);cursor:pointer;border:1px solid var(--line);
  }
  .tab.active{background:var(--accent-green);color:#04231f;border-color:var(--accent-green);}

  /* ---- player picker ---- */
  .player-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
  .player-chip{
    background:var(--bg-panel-2);border:1px solid var(--line);border-radius:10px;
    padding:12px 16px;cursor:pointer;text-align:left;min-width:120px;
    transition:border-color .15s ease;
  }
  .player-chip:hover{border-color:var(--accent-light);}
  .player-chip .name{font-weight:700;font-size:15px;}
  .player-chip .lv{font-family:var(--font-mono);font-size:11px;color:var(--accent-light);}

  /* ---- monster battle ---- */
  .battle-card{
    background:radial-gradient(ellipse at 50% 0%, rgba(228,87,46,0.28), transparent 65%), var(--bg-panel-2);
    border:1px solid var(--accent-red);border-radius:14px;padding:22px;text-align:center;position:relative;
  }
  .monster-emoji{font-size:64px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 0 14px rgba(228,87,46,0.45));}
  .monster-emoji.shake{animation:shake .35s ease;}
  .boss-emoji{font-size:88px;filter:drop-shadow(0 0 28px rgba(228,87,46,0.7)) drop-shadow(0 0 10px rgba(255,80,20,0.5));animation:bossPulse 2.2s ease-in-out infinite;}
  @keyframes bossPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  @keyframes shake{
    0%,100%{transform:translate(0,0) rotate(0);}
    20%{transform:translate(-6px,2px) rotate(-4deg);}
    40%{transform:translate(5px,-2px) rotate(3deg);}
    60%{transform:translate(-4px,1px) rotate(-2deg);}
    80%{transform:translate(3px,0) rotate(2deg);}
  }
  .monster-name{font-family:var(--font-display);font-size:22px;color:var(--accent-light);letter-spacing:0.5px;}
  .hp-bar-outer{background:var(--bg-deep);border:1px solid var(--line);border-radius:20px;height:16px;overflow:hidden;margin:10px auto;max-width:340px;}
  .hp-bar-inner{height:100%;background:linear-gradient(90deg,var(--accent-red),#ff8a5c);transition:width .4s ease;}
  .hp-text{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
  .energy-row{display:flex;justify-content:center;gap:18px;margin-top:14px;font-family:var(--font-mono);font-size:13px;color:var(--text-dim);}
  .energy-row b{color:var(--accent-light);font-size:16px;}

  /* ---- stat cards ---- */
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .stat-card{flex:1;min-width:100px;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
  .stat-card .v{font-family:var(--font-display);font-size:26px;color:var(--accent-light);}
  .stat-card .l{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;}

  /* ---- items checklist ---- */
  .item-list{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
  .item-row{
    display:flex;align-items:center;gap:10px;background:var(--bg-deep);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;
  }
  .item-row input{width:auto;}
  .item-row .xp-tag{margin-left:auto;font-family:var(--font-mono);color:var(--accent-green);font-size:12px;}
  .item-row.done{opacity:0.45;}

  /* ---- table (coach overview) ---- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;text-align:left;padding:8px;border-bottom:1px solid var(--line);}
  td{padding:9px 8px;border-bottom:1px solid var(--line);}
  tr:hover td{background:rgba(255,255,255,0.02);}

  .row-flex{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .row-flex > div{flex:1;min-width:140px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--bg-panel-2);border:1px solid var(--accent-light);color:var(--text-chalk);
    padding:12px 22px;border-radius:10px;font-size:14px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,0.4);
    animation:fadein .2s ease;
  }
  @keyframes fadein{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

  .modal-bg{position:fixed;inset:0;background:rgba(5,10,20,0.7);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;}
  .modal{background:var(--bg-panel);border:1px solid var(--accent-light);border-radius:14px;padding:24px;max-width:420px;width:100%;}
  .modal h3{font-family:var(--font-display);font-size:22px;margin:0 0 14px;color:var(--accent-light);}
  .opt-btn{
    display:block;width:100%;text-align:left;background:var(--bg-panel-2);border:1px solid var(--line);
    color:var(--text-chalk);padding:11px 14px;border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:14px;
  }
  .opt-btn:hover{border-color:var(--accent-light);}
  .opt-btn.correct{background:rgba(42,157,143,0.25);border-color:var(--accent-green);}
  .opt-btn.wrong{background:rgba(228,87,46,0.25);border-color:var(--accent-red);}
  .opt-btn:disabled{cursor:default;}

  /* ---- mini battle animation ---- */
  .mini-battle{display:flex;align-items:center;justify-content:center;gap:28px;margin:18px 0 6px;position:relative;height:64px;}
  .mini-battle .attacker{font-size:38px;transform-origin:70% 70%;}
  .mini-battle .boss-target{font-size:46px;position:relative;}
  .mini-battle .impact{font-size:32px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);opacity:0;}
  .mini-battle .dmg-float{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-family:var(--font-display);font-size:22px;color:var(--accent-red);opacity:0;white-space:nowrap;}
  .mini-battle.dodge .dmg-float{color:var(--accent-light);}
  .mini-battle.hit .attacker{animation:swingHit .5s ease;}
  .mini-battle.hit .impact{animation:impactPop .6s ease .22s forwards;}
  .mini-battle.hit .boss-target{animation:bossHit .4s ease .35s;}
  .mini-battle.hit .dmg-float{animation:dmgFloat 1s ease .3s forwards;}
  .mini-battle.dodge .attacker{animation:swingHit .5s ease;}
  .mini-battle.dodge .impact{animation:impactPop .5s ease .2s forwards;}
  .mini-battle.dodge .boss-target{animation:bossDodge .55s ease .3s;}
  .mini-battle.dodge .dmg-float{animation:dmgFloat 1s ease .35s forwards;}
  .mini-battle.miss .attacker{animation:swingMiss .5s ease;}
  .mini-battle.miss .impact{animation:missPop .5s ease .15s forwards;}
  @keyframes swingHit{0%{transform:rotate(0);}35%{transform:rotate(-30deg) translateX(-8px);}70%{transform:rotate(40deg) translateX(12px);}100%{transform:rotate(0);}}
  @keyframes swingMiss{0%{transform:rotate(0);}50%{transform:rotate(-18deg);}100%{transform:rotate(8deg);}}
  @keyframes impactPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0;}45%{transform:translate(-50%,-50%) scale(1.4);opacity:1;}100%{transform:translate(-50%,-50%) scale(0.9);opacity:0;}}
  @keyframes missPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0;}50%{transform:translate(-50%,-50%) scale(1.1);opacity:0.8;}100%{transform:translate(-50%,-50%) scale(0.8);opacity:0;}}
  @keyframes bossHit{0%,100%{transform:translateX(0) rotate(0);}30%{transform:translateX(10px) rotate(6deg);}60%{transform:translateX(-8px) rotate(-4deg);}}
  @keyframes bossDodge{0%{transform:translateX(0);}40%{transform:translateX(-34px) scale(0.9);}70%{transform:translateX(8px);}100%{transform:translateX(0);}}
  @keyframes dmgFloat{0%{opacity:0;transform:translate(-50%,0);}25%{opacity:1;}100%{opacity:0;transform:translate(-50%,-32px);}}

  .empty{color:var(--text-dim);font-size:13px;padding:14px 0;text-align:center;}
  .small-note{font-size:11px;color:var(--text-dim);margin-top:6px;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
</style>
</head>

<script>
/* ============ 資料存取層（Firebase Firestore） ============ */
const FS_COLLECTION = 'gameData'; // 所有資料存在這個 collection 裡，每筆資料一個文件

async function dbGet(key){
  const snap = await fbDb.collection(FS_COLLECTION).doc(key).get();
  if(!snap.exists) throw new Error('not found: '+key);
  return snap.data().value;
}
async function dbSet(key, value){
  await fbDb.collection(FS_COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
}
async function dbDelete(key){
  await fbDb.collection(FS_COLLECTION).doc(key).delete();
}
async function dbListPrefix(prefix){
  const snap = await fbDb.collection(FS_COLLECTION)
    .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
    .where(firebase.firestore.FieldPath.documentId(), '<', prefix+'\uf8ff')
    .get();
  return snap.docs.map(d => d.id.slice(prefix.length));

async function getConfig(){
  try{
    const value = await dbGet('config');
    const parsed = JSON.parse(value);
    // 補上舊版資料可能缺少的欄位，避免功能因為缺欄位而失效
    if(!parsed.bonusTasks) parsed.bonusTasks = [];
    if(!parsed.shopItems) parsed.shopItems = [];
    if(parsed.penaltyPoints==null) parsed.penaltyPoints = 30;
    if(parsed.bossDodgeChance==null) parsed.bossDodgeChance = 0.2;
    if(parsed.attackEnergyCost==null) parsed.attackEnergyCost = 1;
    if(parsed.ultimateDamage==null) parsed.ultimateDamage = 100;
    if(!parsed.bossRoster || !parsed.bossRoster.length) parsed.bossRoster = DEFAULT_BOSS_ROSTER.slice();
    if(!parsed.skillRoster) parsed.skillRoster = buildDefaultConfig().skillRoster;
    if(!parsed.classTiers) parsed.classTiers = buildDefaultConfig().classTiers;
    if(!parsed.starterCharacterIds || !parsed.starterCharacterIds.length) parsed.starterCharacterIds = STARTER_CHARACTER_IDS.slice();
    (parsed.skillRoster||[]).forEach(s=>{
      if(!s.stages || !s.stages.length){
        // 舊版單階技能格式，轉換成一個階段
        if(s.type==='passive'){
          s.stages = [{level:s.unlockLevel||1, bonusDamage:s.bonusDamage||0, dodgeReduction:s.dodgeReduction||0, bonusPoints:s.bonusPoints||0}];
        } else {
          s.stages = [{level:s.unlockLevel||1, cost:s.cost||1, effect:s.activeEffect||'doubleDamage', multiplier:2}];
        }
      }
    });
    if(!parsed.formUrl) parsed.formUrl = '';
    if(parsed.coachPassword==null) parsed.coachPassword = '';
    (parsed.items||[]).forEach(it=>{
      if(it.subOptions==null) it.subOptions = [];
      it.subOptions = it.subOptions.map(o=> typeof o==='string' ? {label:o, xp:5, points:0} : o);
      it.subOptions.forEach(o=>{ if(o.points==null) o.points = 0; });
      if(it.required==null) it.required = false;
      if(it.requireVideo==null) it.requireVideo = false;
      if(it.points==null) it.points = 0;
    });
    (parsed.questions||[]).forEach(q=>{ if(q.subTag===undefined) q.subTag = null; });
    return parsed;
  }catch(e){
    const def = buildDefaultConfig();
    await dbSet('config', JSON.stringify(def));
    return def;
  }
}
function resetToDefaultConfig(){
  askConfirm('這會把「練習項目」與「題庫」重設為系統最新的預設內容（球員的等級／點數／練習紀錄不會被清除）。確定要重設嗎？', async ()=>{
    state.config = buildDefaultConfig();
    await saveConfig(state.config);
    showToast('已重設為最新的預設項目與題庫');
    render();
  });
}
async function importQuestionsByPrefix(prefix, label){
  const defaults = buildDefaultConfig().questions.filter(q=>q.id.startsWith(prefix));
  const existingIds = new Set(state.config.questions.map(q=>q.id));
  const newOnes = defaults.filter(q=>!existingIds.has(q.id));
  if(newOnes.length===0){ showToast('這些題目已經在題庫裡了'); return; }
  state.config.questions = state.config.questions.concat(newOnes);
  await saveConfig(state.config);
  showToast('已匯入 '+newOnes.length+' 題'+(label||'')+'新題目，不會影響你原本的題目與項目設定');
  render();
}
async function importExamQuestions(){ return importQuestionsByPrefix('exam_', ''); }

async function importTrainingLogItem(){
  if(state.config.items.some(i=>i.id==='training_log')){ showToast('「訓練日誌」項目已經存在了'); return; }

function normalizePlayer(p){
  if(!p) return p;
  if(!p.bonusLog) p.bonusLog = [];
  if(!p.redemptions) p.redemptions = [];
  if(!p.inventory) p.inventory = [];
  if(p.realName==null) p.realName = '';
  if(p.activeBuff===undefined) p.activeBuff = null;
  if(!p.avatarId) p.avatarId = (CHARACTER_ROSTER[0] && CHARACTER_ROSTER[0].id) || null;
  if(p.level>50) p.level = 50;
  if(p.tutorialSeen===undefined) p.tutorialSeen = false;
  if(p.ultimateGauge==null) p.ultimateGauge = 0;
  return p;
}

function bossTemplateAt(idx){
  const roster = (state.config && state.config.bossRoster && state.config.bossRoster.length) ? state.config.bossRoster : DEFAULT_BOSS_ROSTER;
  return roster[((idx%roster.length)+roster.length)%roster.length];
}
function applyTplFields(boss, tpl){

  boss.quote = tpl.quote;
}
function bossMaxHP(bossNumber){ return 500 + (bossNumber-1)*300; }

/* 對敵人造成傷害並處理擊敗/換下一隻的共用邏輯 */
async function applyBossDamage(boss, damage, playerName){
  boss.hp = Math.max(0, boss.hp-damage);
  let defeated = false;
  if(boss.hp<=0){
    defeated = true;
    const newBossNumber = boss.bossNumber+1;
    const tpl = bossTemplateAt(newBossNumber-1);
    boss.bossNumber = newBossNumber;
    applyTplFields(boss, tpl);
    boss.maxHp = bossMaxHP(newBossNumber);
    boss.hp = boss.maxHp;
    boss.kills = boss.kills || [];
    boss.kills.unshift({date:todayStr(), by:playerName});
    boss.kills = boss.kills.slice(0,10);
  }
  return defeated;
}
const EXP_PER_CORRECT = 10; // 每次命中（答對）獲得的經驗值
const EXP_PER_LEVEL = 50;   // 每一等所需的經驗值
const MAX_LEVEL = 50;       // 等級上限
function levelForCorrect(correct){
  return Math.min(MAX_LEVEL, Math.floor((correct*EXP_PER_CORRECT)/EXP_PER_LEVEL)+1);
}
async function getTeamBoss(){
  try{
    const value = await dbGet('teamBoss');
    const b = JSON.parse(value);
    if((!b.emoji && !b.image) || !b.templateId){
      const tpl = bossTemplateAt((b.bossNumber||1)-1);
      applyTplFields(b, tpl);
    }
    return b;
  }catch(e){
    const tpl = bossTemplateAt(0);
    const boss = { bossNumber:1, hp:bossMaxHP(1), maxHp:bossMaxHP(1), kills:[] };
    applyTplFields(boss, tpl);
    await dbSet('teamBoss', JSON.stringify(boss));
    return boss;
  }
}
async function saveTeamBoss(b){
  await dbSet('teamBoss', JSON.stringify(b));
}
function resetTeamBoss(){
  askConfirm('這會重置全隊 Boss 的血量與編號，確定要重置嗎？', async ()=>{

    await saveTeamBoss(boss);

}

async function saveBossDodgeChance(){
  const pct = Number(state.bossDodgeDraft!==null?state.bossDodgeDraft:Math.round((state.config.bossDodgeChance!=null?state.config.bossDodgeChance:0.2)*100));
  if(isNaN(pct) || pct<0 || pct>100){ showToast('請輸入 0-100 之間的數字'); return; }
  const cost = Number(state.attackCostDraft!==null?state.attackCostDraft:(state.config.attackEnergyCost!=null?state.config.attackEnergyCost:1));
  if(isNaN(cost) || cost<0){ showToast('攻擊消耗能量請輸入 0 以上的數字'); return; }
  const ultDmg = Number(state.ultimateDmgDraft!==null?state.ultimateDmgDraft:(state.config.ultimateDamage!=null?state.config.ultimateDamage:100));
  if(isNaN(ultDmg) || ultDmg<0){ showToast('必殺技傷害值請輸入 0 以上的數字'); return; }
  state.config.bossDodgeChance = pct/100;
  state.config.attackEnergyCost = cost;
  state.config.ultimateDamage = ultDmg;
  await saveConfig(state.config);
  state.bossDodgeDraft = null;
  state.attackCostDraft = null;
  state.ultimateDmgDraft = null;
  showToast('已更新設定：Boss 閃避機率 '+pct+'%、每次攻擊消耗 '+cost+' 點能量、必殺技傷害 '+ultDmg);
  render();
}
async function applyBossTemplate(templateId){

  const boss = state.teamBoss || await getTeamBoss();

  showToast('目前敵人已經換成「'+tpl.name+'」');
  render();
}

/* ---- 技能系統（支援隨等級進化） ---- */
function skillCurrentStage(skill, level){
  const eligible = (skill.stages||[]).filter(st=>level>=st.level).sort((a,b)=>b.level-a.level);
  return eligible[0] || null;
}
function skillNextStage(skill, level){
  const upcoming = (skill.stages||[]).filter(st=>st.level>level).sort((a,b)=>a.level-b.level);
  return upcoming[0] || null;
}
function unlockedSkills(p){
  return (state.config.skillRoster||[]).filter(s=>!!skillCurrentStage(s, p.level));
}
function skillIconFor(s){
  if(s.type==='passive'){
    const st = (s.stages && s.stages[0]) || {};
    if(st.bonusDamage) return '⚔️';
    if(st.dodgeReduction) return '🛡️';
    if(st.bonusPoints) return '💰';
    return '✨';
  }
  return (s.stages && s.stages[0] && s.stages[0].effect==='guaranteedHit') ? '🎯' : '💥';
}
function skillStageDesc(skill, stage){
  if(!stage) return '';
  if(skill.type==='passive'){
    const parts = [];
    if(stage.bonusDamage) parts.push('傷害+'+stage.bonusDamage);
    if(stage.dodgeReduction) parts.push('Boss閃避-'+Math.round(stage.dodgeReduction*100)+'%');
    if(stage.bonusPoints) parts.push('答對額外+'+stage.bonusPoints+'點數');
    return parts.join('、')||'無效果';
  }
  return '花💰'+stage.cost+'，'+(stage.effect==='doubleDamage'?('傷害x'+(stage.multiplier||2)):'必定命中');
}
/* ---- 職業轉職系統 ---- */
function classTiersFor(characterId){
  return (state.config.classTiers && state.config.classTiers[characterId]) || [];
}
function classTierCurrent(characterId, level){
  const tiers = classTiersFor(characterId).slice().sort((a,b)=>b.level-a.level);
  return tiers.find(t=>level>=t.level) || null;
}
function classTierNext(characterId, level){
  const tiers = classTiersFor(characterId).slice().sort((a,b)=>a.level-b.level);
  return tiers.find(t=>t.level>level) || null;
}
function classTierPathSummary(characterId){
  const tiers = classTiersFor(characterId).slice().sort((a,b)=>a.level-b.level);
  const evolutions = tiers.filter(t=>t.level>1);
  if(!evolutions.length) return '';
  return evolutions.map(t=>'Lv.'+t.level+' → '+t.title).join('　');
}
function activePassiveBonuses(p){
  const fromSkills = unlockedSkills(p).filter(s=>s.type==='passive').reduce((acc,s)=>{
    const stage = skillCurrentStage(s, p.level);
    if(stage){
      acc.bonusDamage += Number(stage.bonusDamage)||0;
      acc.dodgeReduction += Number(stage.dodgeReduction)||0;
      acc.bonusPoints += Number(stage.bonusPoints)||0;
    }
    return acc;
  }, {bonusDamage:0, dodgeReduction:0, bonusPoints:0});
  const classTier = classTierCurrent(p.avatarId, p.level);
  if(classTier){
    fromSkills.bonusDamage += Number(classTier.bonusDamage)||0;
    fromSkills.dodgeReduction += Number(classTier.dodgeReduction)||0;
    fromSkills.bonusPoints += Number(classTier.bonusPoints)||0;
  }
  return fromSkills;
}
async function activateSkill(skillId){
  const p = state.playerData;
  const skill = unlockedSkills(p).find(s=>s.id===skillId && s.type==='active');
  if(!skill) return;
  const stage = skillCurrentStage(skill, p.level);
  if(!stage) return;
  if(p.activeBuff){ showToast('已經有一個技能生效中，先攻擊一次用掉它吧'); return; }
  if(p.points < stage.cost){ showToast('點數不足，還差 '+(stage.cost-p.points)+' 點'); return; }
  p.points -= stage.cost;
  p.activeBuff = { skillId: skill.id, effect: stage.effect, multiplier: Number(stage.multiplier)||2, name: skill.name };
  await savePlayer(p);
  showToast('已啟動「'+skill.name+'」，下一次攻擊生效！');
  render();
}

async function addSkill(){
  const d = state.addSkillDraft;
  if(!d.name.trim()){ showToast('請輸入技能名稱'); return; }
  const id = 'sk_'+Date.now();
  const skill = {
    id, name:d.name.trim(), desc:(d.desc||'').trim(), type: d.type,
    stages: []
  };
  if(d.type==='passive'){
    skill.stages.push({level:Number(d.unlockLevel)||1, bonusDamage:Number(d.bonusDamage)||0, dodgeReduction:(Number(d.dodgeReductionPct)||0)/100, bonusPoints:Number(d.bonusPoints)||0});
  } else {
    skill.stages.push({level:Number(d.unlockLevel)||1, cost:Number(d.cost)||1, effect:d.activeEffect, multiplier:d.activeEffect==='doubleDamage'?2:1});
  }
  if(!state.config.skillRoster) state.config.skillRoster = [];
  state.config.skillRoster.push(skill);
  await saveConfig(state.config);
  state.addSkillDraft = {name:'', desc:'', unlockLevel:2, type:'passive', bonusDamage:5, dodgeReductionPct:0, bonusPoints:0, cost:10, activeEffect:'doubleDamage'};
  showToast('已新增技能（第一階段）');
  render();
}

  render();
}
async function addSkillStage(skillId){
  const skill = (state.config.skillRoster||[]).find(s=>s.id===skillId);
  if(!skill) return;
  const draft = state.skillStageDraft[skillId] || {};
  const level = Number(draft.level)||1;
  if(skill.stages.some(st=>st.level===level)){ showToast('這個等級已經有階段了，換一個等級吧'); return; }
  let stage;
  if(skill.type==='passive'){
    stage = {level, bonusDamage:Number(draft.bonusDamage)||0, dodgeReduction:(Number(draft.dodgeReductionPct)||0)/100, bonusPoints:Number(draft.bonusPoints)||0};
  } else {
    stage = {level, cost:Number(draft.cost)||1, effect:draft.effect||'doubleDamage', multiplier:Number(draft.multiplier)||2};
  }
  skill.stages.push(stage);
  skill.stages.sort((a,b)=>a.level-b.level);
  await saveConfig(state.config);
  state.skillStageDraft[skillId] = {};
  showToast('已新增進化階段：Lv.'+level);
  render();
}
async function removeSkillStage(skillId, level){
  const skill = (state.config.skillRoster||[]).find(s=>s.id===skillId);
  if(!skill) return;
  if(skill.stages.length<=1){ showToast('至少要保留一個階段喔（不然這個技能就永遠沒有效果了）'); return; }
  skill.stages = skill.stages.filter(st=>st.level!==level);
  await saveConfig(state.config);
  render();
}
async function addClassTier(characterId){
  const d = state.classTierDraft[characterId] || {};
  const level = Number(d.level);
  const title = (d.title||'').trim();
  if(!level || level<1){ showToast('請輸入有效的等級'); return; }
  if(!title){ showToast('請輸入職業稱號'); return; }
  if(!state.config.classTiers) state.config.classTiers = {};
  if(!state.config.classTiers[characterId]) state.config.classTiers[characterId] = [];
  if(state.config.classTiers[characterId].some(t=>t.level===level)){ showToast('這個等級已經有轉職階級了，換一個等級吧'); return; }
  state.config.classTiers[characterId].push({
    level, title, desc:(d.desc||'').trim(),
    bonusDamage:Number(d.bonusDamage)||0,
    dodgeReduction:(Number(d.dodgeReductionPct)||0)/100,
    bonusPoints:Number(d.bonusPoints)||0
  });
  state.config.classTiers[characterId].sort((a,b)=>a.level-b.level);
  await saveConfig(state.config);
  state.classTierDraft[characterId] = {};

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysBetween(a,b){
  const da = new Date(a), db = new Date(b);
  return Math.round((db-da)/86400000);
}
function logItemName(it){ return typeof it==='string' ? it : it.name; }
function logItemDetail(it){ return (typeof it==='object' && it.detail) ? it.detail : ''; }
function logItemsDisplay(log){
  return (log.items||[]).map(it=>{
    const n = logItemName(it), d = logItemDetail(it);
    return d ? (n+'（'+d+'）') : n;
  }).join('、');
}
function computeItemRewards(it){
  if(it.subOptions && it.subOptions.length){
    const d = subDraft[it.id] || {picks:{}, custom:''};
    return it.subOptions.reduce((acc,opt)=>{
      if(d.picks[opt.label]){
        acc.energy += Number(opt.xp)||0;
        acc.points += Number(opt.points)||0;
      }
      return acc;
    }, {energy:0, points:0});
  }
  return { energy: Number(it.xp)||0, points: Number(it.points)||0 };
}

  const names = new Set();

async function submitPractice(){
  const p = state.playerData;
  const today = todayStr();
  const doneToday = doneNamesToday(p);
  const chosen = state.config.items.filter(it=>checklistDraft[it.id] && !doneToday.has(it.name));
  if(chosen.length===0){ showToast('至少勾選一項今天還沒完成的練習'); return; }
  const missingRequired = state.config.items.filter(it=>it.required && !doneToday.has(it.name) && !checklistDraft[it.id]);
  if(missingRequired.length){
    showToast('尚未完成每日任務：'+missingRequired.map(i=>i.name).join('、'));
    return;
  }
  // 檢查有內容選項的項目，是否至少選了一項內容
  for(const it of chosen){
    if(it.subOptions && it.subOptions.length){
      const d = subDraft[it.id] || {picks:{}, custom:''};
      const anyPicked = Object.values(d.picks).some(Boolean);
      if(!anyPicked){ showToast('「'+it.name+'」請至少選擇一項內容'); return; }
      const usesCustom = d.picks['自訂內容'];
      if(usesCustom && !d.custom.trim()){ showToast('「'+it.name+'」的自訂內容請填寫說明'); return; }
    }
  }
  const needsVideo = chosen.some(it=>it.requireVideo);
  if(needsVideo && !state.videoUploadedDraft){
    showToast('此任務需要上傳證明（照片／影片），請先上傳並勾選「已上傳今天的證明」');
    return;
  }
  const rewards = chosen.reduce((acc,it)=>{
    const r = computeItemRewards(it);
    acc.energy += r.energy;
    acc.points += r.points;
    return acc;
  }, {energy:0, points:0});
  p.energy += rewards.energy;
  p.points += rewards.points;
  const isNewDay = p.lastDate !== today;
  if(isNewDay){
    if(p.lastDate && daysBetween(p.lastDate, today)===1){ p.streak += 1; }
    else { p.streak = 1; }
    p.lastDate = today;
  }
  const videoDone = !!state.videoUploadedDraft;
  const itemsForLog = chosen.map(it=>{
    let detail = '';
    if(it.subOptions && it.subOptions.length){
      const d = subDraft[it.id] || {picks:{}, custom:''};
      const labels = Object.keys(d.picks).filter(k=>d.picks[k] && k!=='自訂內容').concat(d.picks['自訂內容']?[d.custom.trim()]:[]);
      detail = labels.join('、');
    }
    return {name: it.name, detail};
  });
  p.log.unshift({
    date:today, items:itemsForLog, xp:rewards.energy, coins:rewards.points,
    video:videoDone, needsReview:needsVideo,
    reviewStatus: needsVideo ? 'pending' : 'approved'
  });
  p.log = p.log.slice(0,20);
  await savePlayer(p);
  checklistDraft = {};
  subDraft = {};
  state.videoUploadedDraft = false;
  showToast('練習已記錄！獲得 ⚡'+rewards.energy+' 能量、💰'+rewards.points+' 點數'+(needsVideo?'，等待教練審核':''));
  render();
}

function todayItemDetails(p){
  const today = todayStr();
  const map = {}; // itemName -> Set of detail 細項 labels (空字串代表沒有內容選項也已完成)
  p.log.filter(l=>l.date===today).forEach(l=>{
    (l.items||[]).forEach(it=>{
      const name = logItemName(it);
      const detail = logItemDetail(it);
      if(!map[name]) map[name] = new Set();
      if(detail){
        detail.split('、').forEach(d=>{ if(d.trim()) map[name].add(d.trim()); });
      } else {
        map[name].add('');
      }
    });
  });
  return map;
}

function pickQuestion(){
  const qs = state.config.questions;
  if(qs.length===0) return null;
  const detailMap = todayItemDetails(state.playerData);
  const doneNames = Object.keys(detailMap);
  let pool = qs;
  if(doneNames.length){
    // 優先：題目指定了內容選項細項，且今天剛好做了那個細項
    const subTagPool = qs.filter(q=>{
      if(!q.subTag) return false;
      const item = state.config.items.find(it=>it.id===q.tag);
      if(!item) return false;
      const details = detailMap[item.name];
      return details && details.has(q.subTag);
    });
    if(subTagPool.length){
      pool = subTagPool;
    } else {
      // 其次：題目只對應到整個項目（沒有指定細項），且今天有做這個項目
      const tagPool = qs.filter(q=>{
        if(q.subTag) return false;
        const item = state.config.items.find(it=>it.id===q.tag);
        return item && doneNames.includes(item.name);
      });
      if(tagPool.length) pool = tagPool;
    }
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

async function answerQuiz(idx){
  if(state.quiz.selectedIdx!==null) return;
  const p = state.playerData;
  const q = state.quiz.q;
  const isCorrect = idx===q.correct;
  const passive = activePassiveBonuses(p);
  const buff = p.activeBuff;
  const guaranteedHit = isCorrect && buff && buff.effect==='guaranteedHit';
  const baseDodgeChance = state.config.bossDodgeChance!=null ? state.config.bossDodgeChance : 0.2;
  const dodgeChance = Math.max(0, baseDodgeChance - passive.dodgeReduction);
  const dodged = isCorrect && !guaranteedHit && (Math.random()<dodgeChance);
  let damage = 20 + passive.bonusDamage;
  if(isCorrect && buff && buff.effect==='doubleDamage') damage *= (Number(buff.multiplier)||2);
  state.quiz.selectedIdx = idx;
  state.quiz.result = isCorrect ? 'correct' : 'wrong';
  state.quiz.dodged = dodged;
  state.quiz.damage = damage;
  state.quiz.monsterReaction = pickMonsterReaction(!isCorrect ? 'miss' : (dodged ? 'dodge' : 'hit'));
  render();

  const attackCost = state.config.attackEnergyCost!=null ? state.config.attackEnergyCost : 1;
  p.energy = Math.max(0, p.energy-attackCost);
  let bossDefeated = false;
  let usedBuffName = null;
  let leveledUpTo = null;
  let classPromotedTo = null;
  if(isCorrect){
    p.correct += 1;
    p.points += 5 + passive.bonusPoints;
    p.ultimateGauge = Math.min(100, (p.ultimateGauge||0) + 20);
    const oldLevel = p.level;
    const newLevel = levelForCorrect(p.correct);
    if(newLevel>p.level){
      p.level = newLevel;
      leveledUpTo = newLevel;
      const newTier = classTierCurrent(p.avatarId, newLevel);
      const oldTier = classTierCurrent(p.avatarId, oldLevel);
      if(newTier && (!oldTier || oldTier.level!==newTier.level)) classPromotedTo = newTier.title;
    }
    if(buff){ usedBuffName = buff.name; p.activeBuff = null; }

    if(!dodged){
      const boss = await getTeamBoss();
      bossDefeated = await applyBossDamage(boss, damage, p.name);
      if(bossDefeated) p.points += 80;
      await saveTeamBoss(boss);
      state.teamBoss = boss;
    }
  } else {
    p.wrong += 1;
    p.ultimateGauge = Math.min(100, (p.ultimateGauge||0) + 5);
  }
  await savePlayer(p);

  setTimeout(()=>{
    state.quiz = null;
    render();
    const levelUpText = leveledUpTo ? ('🌟 升到 Lv.'+leveledUpTo+(leveledUpTo>=MAX_LEVEL?'（已達最高等級！）':'')+'！'+(classPromotedTo?(' 🎖️ 轉職成為「'+classPromotedTo+'」！'):'')) : '';
    if(bossDefeated) showToast(levelUpText+'🎉 全隊擊破了敵人！新的「'+(state.teamBoss?state.teamBoss.name:'敵人')+'」已經出現，血量更高了！你獲得最後一擊獎勵 +80 點數！');
    else if(isCorrect && dodged) showToast(levelUpText+'💨 完美命中弱點！可惜被對方閃過了，沒有造成傷害（+5 點數）');
    else if(isCorrect) showToast(levelUpText+(usedBuffName?'✨「'+usedBuffName+'」發動！':'')+'看穿破綻！造成 '+damage+' 傷害，+5 點數');
    else showToast('揮棒落空，沒有造成傷害');
  }, 1800);
}

async function useUltimate(){
  const p = state.playerData;
  if((p.ultimateGauge||0)<100){ showToast('必殺技量表還沒集滿喔！'); return; }
  const dmg = state.config.ultimateDamage!=null ? state.config.ultimateDamage : 100;

async function addItem(){
  const d = state.addItemDraft;
  if(!d.name.trim()){ showToast('請輸入項目名稱'); return; }
  const subOptions = (d.subOptionsText||'').split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
    const parts = line.split('/');
    const label = parts[0].trim();
    const xp = parts[1]!==undefined ? (Number(parts[1].trim())||1) : 5;
    const points = parts[2]!==undefined ? (Number(parts[2].trim())||0) : 0;
    return {label, xp, points};
  });
  if(state.editingItemId){
    const it = state.config.items.find(i=>i.id===state.editingItemId);
    if(it){
      it.name = d.name.trim();
      it.xp = Number(d.xp)||1;
      it.points = Number(d.points)||0;
      it.required = !!d.required;
      it.requireVideo = !!d.requireVideo;
      it.subOptions = subOptions;
    }
    state.editingItemId = null;
    showToast('已更新項目');
  } else {
    const id = 'it_'+Date.now();
    state.config.items.push({id, name:d.name.trim(), xp:Number(d.xp)||1, points:Number(d.points)||0, required:!!d.required, requireVideo:!!d.requireVideo, subOptions});

  state.addItemDraft = {name:'', xp:10, points:5, required:false, requireVideo:false, subOptionsText:''};

}

function buyShopItem(itemId){
  const item = (state.config.shopItems||[]).find(s=>s.id===itemId);
  if(!item) return;
  const p = state.playerData;
  if(p.points<item.cost){ showToast('點數不足，還差 '+(item.cost-p.points)+' 點'); return; }
  if(item.advanceNotice){
    const dateVal = (state.shopDateDraft && state.shopDateDraft[itemId]) || '';
    if(!dateVal){ showToast('請先選擇想使用的日期'); return; }
    if(dateVal<=todayStr()){ showToast('這個項目不可當日使用，請選擇之後的日期'); return; }
    doBuyShopItem(item, dateVal);
  } else {
    doBuyShopItem(item, null);
  }

async function doBuyShopItem(item, useDate){
  const p = state.playerData;
  p.points -= item.cost;
  const inv = {
    id: 'inv_'+Date.now(),
    itemId: item.id, itemName: item.name,
    cost: item.cost, purchaseDate: todayStr(),
    useDate: useDate || null,
    status: useDate ? 'scheduled' : 'unused',
    usedAt: null
  };
  p.inventory.unshift(inv);
  await savePlayer(p);
  if(state.shopDateDraft) state.shopDateDraft[item.id] = '';
  showToast('已兌換「'+item.name+'」！'+(useDate?('預定使用日期：'+useDate):''));
  render();
}

  const p = state.playerData;

  p.energy = Math.max(0, p.energy + delta);

async function reviewLog(name, index, decision){
  const p = await getPlayer(name);
  const entry = p.log[index];
  if(!entry || entry.reviewStatus!=='pending'){ return; }
  if(decision==='approve'){
    entry.reviewStatus = 'approved';
    await savePlayer(p);
    showToast('已通過審核');
  } else {
    const penalty = state.config.penaltyPoints!=null ? state.config.penaltyPoints : 30;
    p.points = Math.max(0, p.points-penalty);
    entry.reviewStatus = 'rejected';
    entry.penalty = penalty;
    await savePlayer(p);
    showToast('已判定造假，扣 '+penalty+' 點');
  }
  state.viewingPlayer = p;
  render();
  refreshOverview();
}
let overviewCache = [];
async function refreshOverview(){
  const names = await listPlayers();
  state.players = names;
  const data = [];
  for(const n of names){ data.push(normalizePlayer(await getPlayer(n))); }
  overviewCache = data.filter(Boolean).sort((a,b)=> b.level-a.level || b.points-a.points);
  state.teamBoss = await getTeamBoss();
  render();
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function monsterVisualHtml(boss, sizeClass){
  const px = sizeClass==='boss-emoji-small' ? 56 : 110;
  if(boss && boss.image){
    return `<img src="${boss.image}" class="${sizeClass||'boss-emoji'}" style="width:${px}px;height:${px}px;image-rendering:pixelated;filter:drop-shadow(0 0 ${sizeClass==='boss-emoji-small'?10:20}px rgba(228,87,46,0.6));" alt="${esc(boss.name||'')}">`;
  }
  return `<div class="monster-emoji ${sizeClass||'boss-emoji'}" style="${sizeClass==='boss-emoji-small'?'font-size:44px;':''}">${esc((boss&&boss.emoji)||'🐉')}</div>`;

function render(){
  const app = document.getElementById('app');
  if(state.loading){ app.innerHTML = '<div class="empty">載入中...</div>'; return; }
  if(state.role==='coach' && !state.coachUnlocked){ state.role = 'player'; }

  const showCoachEntry = state.coachUnlocked || (window.location.hash.replace('#','')===COACH_ENTRY_HASH);

  let html = '';
  html += `
  <div class="scoreboard">
    <div>
      <div class="sub">Daily Training Arena</div>
      <h1>⚾ 訓練競技場</h1>
    </div>
    <div class="role-toggle">
      ${state.coachUnlocked ? `
        <button class="role-btn ${state.role==='player'?'active':''}" onclick="setRole('player')">球員模式</button>
        <button class="role-btn ${state.role==='coach'?'active':''}" onclick="setRole('coach')">教練模式</button>
      ` : (showCoachEntry ? `<button class="role-btn" onclick="openCoachLogin()" style="opacity:0.6;">🔐</button>` : '')}
    </div>
  </div>`;

  if(state.role==='player'){
    html += renderPlayerRole();
  } else {
    html += renderCoachRole();
  }

  if(state.showCoachLogin){
    html += renderCoachLoginModal();
  }

  if(state.toast){
    html += `<div class="toast">${esc(state.toast)}</div>`;
  }
  if(state.quiz){
    html += renderQuizModal();
  }
  if(state.viewingPlayer){
    html += renderPlayerLogModal();
  }
  if(state.pendingConfirm){
    html += renderConfirmModal();
  }

  app.innerHTML = html;
}

      cur.bonusPoints?('答對額外+'+cur.bonusPoints+'點數'):''
    ].filter(Boolean) : [];
    const desc = descParts.length ? descParts.join('、') : (cur?'無加成':'尚未設定被動');
    return `
    <div class="modal-bg" onclick="if(event.target===this){state.showSkillDetail=null;render();}">
      <div class="modal" style="max-width:380px;text-align:center;">
        <div style="font-size:48px;">🧬</div>
        <h3>${esc(title)}（職業被動）</h3>
        ${cur && cur.desc ? `<p class="small-note">${esc(cur.desc)}</p>` : ''}
        <div style="margin-top:10px;font-size:14px;">目前效果：${esc(desc)}</div>
        ${next ? `<div class="small-note" style="color:var(--accent-light);margin-top:8px;">⬆ Lv.${next.level} 轉職：${esc(next.title)}</div>` : '<div class="small-note" style="margin-top:8px;">已達最高階級</div>'}
        <div style="margin-top:16px;"><button class="btn secondary" onclick="state.showSkillDetail=null;render();">關閉</button></div>
      </div>
    </div>`;
  }
  const s = (state.config.skillRoster||[]).find(x=>x.id===state.showSkillDetail);
  if(!s){ return ''; }
  const cur = skillCurrentStage(s, p.level);
  const next = skillNextStage(s, p.level);
  const firstLevel = s.stages && s.stages[0] ? s.stages[0].level : 1;
  const locked = !cur;
  const pending = p.activeBuff && p.activeBuff.skillId===s.id;
  const canAfford = cur && p.points>=cur.cost;
  return `
  <div class="modal-bg" onclick="if(event.target===this){state.showSkillDetail=null;render();}">
    <div class="modal" style="max-width:380px;text-align:center;">
      <div style="font-size:48px;">${skillIconFor(s)}</div>
      <h3>${esc(s.name)}</h3>
      ${s.desc ? `<p class="small-note">${esc(s.desc)}</p>` : ''}
      ${locked
        ? `<div style="margin-top:10px;color:var(--text-dim);">🔒 Lv.${firstLevel} 解鎖</div>`
        : `<div style="margin-top:10px;font-size:14px;">目前效果：${esc(skillStageDesc(s,cur))}</div>
           ${s.type==='active' ? (
             pending
               ? '<div class="small-note" style="color:var(--accent-light);margin-top:8px;">⚡ 已啟動，下次攻擊生效</div>'
               : `<button class="btn ${canAfford?'gold':'secondary'}" style="margin-top:10px;" ${(canAfford && !p.activeBuff)?'':'disabled'} onclick="activateSkill('${s.id}')">啟動（💰${cur.cost}）</button>`
           ) : '<div class="small-note" style="color:var(--accent-green);margin-top:6px;">✅ 已啟用</div>'}`}
      ${next ? `<div class="small-note" style="color:var(--accent-light);margin-top:10px;">⬆ Lv.${next.level} 進化：${esc(skillStageDesc(s,next))}</div>` : (cur?'<div class="small-note" style="margin-top:10px;">已達最高階段</div>':'')}
      <div style="margin-top:16px;"><button class="btn secondary" onclick="state.showSkillDetail=null;render();">關閉</button></div>
    </div>
  </div>`;
}

  const attackCost = state.config.attackEnergyCost!=null ? state.config.attackEnergyCost : 1;

  const acc = (p.correct+p.wrong)>0 ? Math.round(p.correct/(p.correct+p.wrong)*100) : 0;
  const totalExp = p.correct*EXP_PER_CORRECT;
  const expIntoLevel = totalExp - (p.level-1)*EXP_PER_LEVEL;
  const expPct = p.level>=MAX_LEVEL ? 100 : Math.max(0, Math.min(100, Math.round(expIntoLevel/EXP_PER_LEVEL*100)));
  const myChar = characterById(p.avatarId);

  const myNextTier = classTierNext(p.avatarId, p.level);

  const doneToday = doneNamesToday(p);
  const allDoneToday = state.config.items.length>0 && state.config.items.every(it=>doneToday.has(it.name));

  let questHint;
  if(!allDoneToday){
    questHint = { text:'先去完成今天的訓練吧！勾選練習項目可以獲得能量和點數。', action:"document.getElementById('path-panel').scrollIntoView({behavior:'smooth',block:'start'});", cta:'前往訓練之路' };
  } else if(p.energy>=attackCost){
    questHint = { text:'你有能量可以攻擊敵人了！去挑戰全隊共同的 Boss 吧！', action:"state.showBattleModal=true;render();", cta:'進入戰鬥' };

  } else {
    questHint = { text:'今天的任務都完成囉！明天再來累積更多能量與經驗值吧！', action:null, cta:null };
  }

  let itemRows = state.config.items.map(it=>{
    const alreadyDone = doneToday.has(it.name);

    const hasSubOptions = it.subOptions && it.subOptions.length>0;
    const badges = (it.required?' <span style="color:var(--accent-light);">⭐每日任務</span>':'') + (it.requireVideo?' <span style="color:var(--accent-red);">📎需上傳證明</span>':'') + (alreadyDone?' <span style="color:var(--accent-green);">✅ 今天已完成</span>':'');
    let subHtml = '';
    if(!alreadyDone && checked && hasSubOptions){
      const d = subDraft[it.id] || {picks:{}, custom:''};
      const subRows = it.subOptions.map(opt=>{
        const isCustom = opt.label==='自訂內容';

          <span>${esc(opt.label)}</span>
          <span class="xp-tag">⚡${opt.xp} 💰${opt.points||0}</span>
        </div>`;
        if(isCustom && picked){
          row += `<div style="padding:0 10px 6px 10px;" onclick="event.stopPropagation()"><input type="text" value="${esc(d.custom)}" oninput="setSubCustom('${it.id}', this.value)" placeholder="請描述你做了什麼訓練"></div>`;
        }
        return row;
      }).join('');

    }
    const xpTag = hasSubOptions ? '依內容選項加總' : `⚡${it.xp} 💰${it.points||0}`;
    return `<div>
      <div class="item-row ${alreadyDone?'done':''}" onclick="${alreadyDone?'':`toggleItem('${it.id}')`}">

  }).join('') || '<div class="empty">尚無紀錄</div>';

  const bonusTasks = state.config.bonusTasks || [];

  let bonusHistory = (p.bonusLog||[]).slice(0,5).map(b=>`<div class="small-note">${esc(b.date)} · ${esc(b.name)} · +${b.points}點</div>`).join('');

    const la = (a.stages&&a.stages[0]?a.stages[0].level:1), lb = (b.stages&&b.stages[0]?b.stages[0].level:1);
    return la-lb;
  });
  const classPassiveTile = `<div onclick="state.showSkillDetail='classPassive';render();" style="cursor:pointer;text-align:center;padding:10px 6px;border-radius:12px;border:2px solid var(--accent-green);background:rgba(42,157,143,0.12);position:relative;">
    <div style="position:absolute;top:4px;right:6px;font-size:11px;">⭐</div>
    <div style="font-size:28px;">🧬</div>
    <div style="font-size:11px;margin-top:4px;color:var(--text-chalk);">${esc(myTierTitle)}</div>
    <div class="small-note" style="font-size:10px;">職業被動</div>
  </div>`;
  let skillTiles = allSkills.map(s=>{
    const firstLevel = s.stages && s.stages[0] ? s.stages[0].level : 1;
    const cur = skillCurrentStage(s, p.level);
    const locked = !cur;
    const icon = skillIconFor(s);
    const pending = p.activeBuff && p.activeBuff.skillId===s.id;
    return `<div onclick="state.showSkillDetail='${s.id}';render();" style="cursor:pointer;text-align:center;padding:10px 6px;border-radius:12px;border:2px solid ${locked?'var(--line)':(pending?'var(--accent-light)':'var(--accent-green)')};background:${locked?'var(--bg-panel-2)':(pending?'rgba(255,209,102,0.15)':'rgba(42,157,143,0.08)')};opacity:${locked?0.55:1};position:relative;">
      ${locked?`<div style="position:absolute;top:4px;right:6px;font-size:12px;">🔒</div>`:(pending?'<div style="position:absolute;top:4px;right:6px;font-size:12px;">⚡</div>':'')}

      <div style="font-size:11px;margin-top:4px;color:${locked?'var(--text-dim)':'var(--text-chalk)'};">${esc(s.name)}</div>
      ${locked?`<div class="small-note" style="font-size:10px;">Lv.${firstLevel} 解鎖</div>`:''}
    </div>`;

  const shopItems = state.config.shopItems || [];
  const minDate = (()=>{ const d=new Date(); d.setDate(d.getDate()+1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })();

        <button class="btn ${canAfford?'gold':'secondary'} small" ${canAfford?'':'disabled'} onclick="buyShopItem('${it.id}')" style="margin-left:auto;">兌換</button>

      ${it.desc?`<div class="small-note">${esc(it.desc)}</div>`:''}
      ${dateInput}
    </div>`;

  const invStatusLabel = (inv)=>{
    if(inv.status==='used') return `<span style="color:var(--accent-dim,var(--text-dim));">已使用（${esc(inv.usedAt)}）</span>`;
    if(inv.status==='scheduled') return `<span style="color:var(--accent-light);">已排定：${esc(inv.useDate)}</span>`;
    return `<span style="color:var(--accent-green);">未使用</span>`;

function renderQuizModal(){
  const q = state.quiz.q;
  const sel = state.quiz.selectedIdx;
  const curBoss = state.teamBoss || {};
  const bossMiniVisual = curBoss.image
    ? `<img src="${curBoss.image}" style="width:46px;height:46px;image-rendering:pixelated;">`
    : `${esc(curBoss.emoji||'🐉')}`;
  let opts = q.options.map((o,i)=>{
    let cls='opt-btn';
    if(sel!==null){
      if(i===q.correct) cls+=' correct';
      else if(i===sel) cls+=' wrong';
    }
    return `<button class="${cls}" ${sel!==null?'disabled':''} onclick="answerQuiz(${i})">${esc(o)}</button>`;
  }).join('');
  let resultLine = '';
  let battleHtml = '';
  let reactionHtml = '';
  if(sel!==null){
    const isCorrect = state.quiz.result==='correct';
    const dodged = !!state.quiz.dodged;
    let battleClass, dmgText, lineHtml;
    if(isCorrect && !dodged){
      battleClass = 'hit';
      dmgText = '-'+(state.quiz.damage||20);
      lineHtml = '<div class="small-note" style="color:var(--accent-green);">✔ 完美命中！看穿弱點造成傷害！</div>';
    } else if(isCorrect && dodged){
      battleClass = 'dodge';
      dmgText = '閃避！';
      lineHtml = '<div class="small-note" style="color:var(--accent-light);">💨 看穿破綻，但被對方閃過了！</div>';
    } else {
      battleClass = 'miss';
      dmgText = '';
      lineHtml = '<div class="small-note" style="color:var(--accent-red);">✘ 揮棒落空，沒有出手機會</div>';
    }
    resultLine = lineHtml;
    battleHtml = `
    <div class="mini-battle ${battleClass}">
      <div class="attacker">🏏</div>
      <div class="impact">${battleClass==='hit'?'💥':(battleClass==='dodge'?'💨':'💦')}</div>
      ${dmgText?`<div class="dmg-float">${dmgText}</div>`:''}
      <div class="boss-target">${bossMiniVisual}</div>
    </div>`;
    if(state.quiz.monsterReaction){
      reactionHtml = `<div style="margin-top:8px;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--text-dim);">
        <span style="color:var(--accent-red);font-weight:600;">${esc(curBoss.name||'敵人')} ${esc(state.quiz.monsterReaction.action)}：</span>
        ${esc(state.quiz.monsterReaction.line)}
      </div>`;
    }
  }
  return `
  <div class="modal-bg" onclick="if(event.target===this && ${sel===null}) closeQuiz()">
    <div class="modal">
      <div class="flex-between" style="align-items:flex-start;">
        <h3 style="margin:0;">⚔️ 攻擊挑戰</h3>
        ${sel===null ? '<button class="btn secondary small" onclick="closeQuiz()">✕ 稍後再攻擊</button>' : ''}
      </div>
      <p style="font-size:15px;line-height:1.5;margin-top:10px;">${esc(q.q)}</p>
      ${opts}
      ${battleHtml}
      ${resultLine}
      ${reactionHtml}
    </div>
  </div>`;
}
function closeQuiz(){
  if(state.quiz && state.quiz.selectedIdx===null){
    state.quiz = null;
    render();
  }
}

            <button class="btn secondary small" onclick="redeemPoints('${esc(p.name)}')">兌換</button>
            <button class="btn secondary small" onclick="viewPlayerLog('${esc(p.name)}')">查看紀錄</button>
            <button class="btn secondary small" style="color:var(--accent-red);" onclick="deletePlayer('${esc(p.name)}')">🗑️ 刪除</button>
          </div>
        </td>
      </tr>`;
    }).join('');
    const rosterOptions = (state.config.bossRoster||DEFAULT_BOSS_ROSTER).map(t=>`<option value="${t.id}" ${boss.templateId===t.id?'selected':''}>${t.emoji?t.emoji+' ':(t.image?'🖼️ ':'')}${esc(t.name)}</option>`).join('');
    body = `
    <div class="panel battle-card" style="margin-top:0;">
      ${monsterVisualHtml(boss)}
      <div class="monster-name">${esc(boss.name)}（Boss #${boss.bossNumber}）</div>
      <div class="small-note" style="font-style:italic;">${esc(boss.quote||'')}</div>
      <div class="hp-bar-outer"><div class="hp-bar-inner" style="width:${bossPct}%;"></div></div>
      <div class="hp-text">全隊共同 HP ${boss.hp} / ${boss.maxHp}</div>
      ${bossKills ? `<div style="margin-top:10px;"><div class="small-note" style="font-weight:600;">最近擊殺紀錄</div>${bossKills}</div>` : ''}
      <div class="row-flex" style="margin-top:12px;align-items:flex-end;">
        <div><label>選擇目前 Boss 造型</label>
          <select onchange="applyBossTemplate(this.value)">${rosterOptions}</select>
        </div>
        <div style="max-width:120px;"><label>Boss 閃避機率(%)</label><input type="number" value="${state.bossDodgeDraft!==null?state.bossDodgeDraft:Math.round((state.config.bossDodgeChance!=null?state.config.bossDodgeChance:0.2)*100)}" oninput="state.bossDodgeDraft=this.value"></div>
        <div style="max-width:130px;"><label>每次攻擊消耗能量</label><input type="number" value="${state.attackCostDraft!==null?state.attackCostDraft:(state.config.attackEnergyCost!=null?state.config.attackEnergyCost:1)}" oninput="state.attackCostDraft=this.value"></div>
        <div style="max-width:130px;"><label>必殺技傷害值</label><input type="number" value="${state.ultimateDmgDraft!==null?state.ultimateDmgDraft:(state.config.ultimateDamage!=null?state.config.ultimateDamage:100)}" oninput="state.ultimateDmgDraft=this.value"></div>
        <div style="flex:0;"><button class="btn secondary small" onclick="saveBossDodgeChance()">儲存</button></div>
        <div style="flex:0;"><button class="btn secondary small" onclick="resetTeamBoss()">🔄 重置 Boss</button></div>
      </div>
    </div>
    <div class="flex-between" style="margin:14px 0 10px;">
      <div class="small-note">共 ${state.players.length} 位球員 ・ 資料為團隊共享，所有裝置即時同步</div>
      <button class="btn secondary small" onclick="refreshOverview()">重新整理</button>
    </div>
    <table><thead><tr><th>角色</th><th>暱稱／ID</th><th>本名</th><th>等級</th><th>能量</th><th>點數</th><th>連續</th><th>正確率</th><th>兌換</th></tr></thead>
    <tbody>${rows || '<tr><td colspan=9 class="empty">尚無球員資料</td></tr>'}</tbody></table>
    <div class="small-note" style="margin-top:12px;">${esc(state.config.rewardNote)}</div>`;
  }

  return `
  <div class="panel">
    <div class="tabs">
      <div class="tab ${state.coachTab==='items'?'active':''}" onclick="setCoachTab('items')">項目管理</div>
      <div class="tab ${state.coachTab==='shop'?'active':''}" onclick="setCoachTab('shop')">商店管理</div>
      <div class="tab ${state.coachTab==='bossroster'?'active':''}" onclick="setCoachTab('bossroster')">Boss 設定</div>
      <div class="tab ${state.coachTab==='skills'?'active':''}" onclick="setCoachTab('skills')">技能設定</div>
      <div class="tab ${state.coachTab==='classtiers'?'active':''}" onclick="setCoachTab('classtiers')">職業設定</div>
      <div class="tab ${state.coachTab==='bonus'?'active':''}" onclick="setCoachTab('bonus')">額外任務</div>
      <div class="tab ${state.coachTab==='questions'?'active':''}" onclick="setCoachTab('questions')">題庫管理</div>
      <div class="tab ${state.coachTab==='overview'?'active':''}" onclick="setCoachTab('overview')">隊伍總覽</div>
    </div>
    ${body}
  </div>`;
}

function setRole(r){
  if(r==='coach' && !state.coachUnlocked){ openCoachLogin(); return; }
  state.role=r;
  if(r==='coach'){ overviewCache=[]; }
  render();
}
function setCoachTab(t){ state.coachTab=t; if(t==='overview'){ overviewCache=[]; } render(); }

function openCoachLogin(){
  state.showCoachLogin = true;
  state.coachPwDraft = '';
  render();
}
function closeCoachLogin(){
  state.showCoachLogin = false;
  render();
}
async function submitCoachLogin(){
  const pw = state.coachPwDraft || '';
  if(!state.config.coachPassword){
    // 第一次使用，還沒設定過密碼：直接把輸入的內容設為新密碼
    if(!pw.trim()){ showToast('請設定一組教練密碼'); return; }
    state.config.coachPassword = pw;
    await saveConfig(state.config);
    state.coachUnlocked = true;
    state.showCoachLogin = false;
    state.role = 'coach';
    showToast('已設定教練密碼，之後用這組密碼登入教練模式');
    render();
    return;
  }
  if(pw === state.config.coachPassword){
    state.coachUnlocked = true;
    state.showCoachLogin = false;
    state.role = 'coach';
    render();
  } else {
    showToast('密碼不對喔');
  }
}
async function changeCoachPassword(){
  const pw = (state.newCoachPwDraft||'').trim();
  if(!pw){ showToast('請輸入新密碼'); return; }
  state.config.coachPassword = pw;
  await saveConfig(state.config);
  state.newCoachPwDraft = '';
  showToast('教練密碼已更新');
  render();
}

init();
</script>
</body>
</html>
