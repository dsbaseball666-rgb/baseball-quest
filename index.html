<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訓練競技場 · 每日練習打怪</title>
<style>
  :root{
    --bg-deep:#0B1626;
    --bg-panel:#132038;
    --bg-panel-2:#1B2C4C;
    --line:#2A3D63;
    --accent-light:#FFD166;
    --accent-red:#E4572E;
    --accent-green:#2A9D8F;
    --text-chalk:#F2EFE9;
    --text-dim:#8FA0C2;
    --font-display:'Teko','Oswald',sans-serif;
    --font-body:'Rubik','Noto Sans TC',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&display=swap');
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,209,102,0.08), transparent 60%),
      var(--bg-deep);
    color:var(--text-chalk);
    font-family:var(--font-body);
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px;}

  /* ---- header / scoreboard bar ---- */
  .scoreboard{
    background:linear-gradient(180deg,#0E1930,#0A1424);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 22px;
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;
    position:relative;
    overflow:hidden;
  }
  .scoreboard::before{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(90deg, rgba(255,209,102,0.05) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .scoreboard h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:34px;
    letter-spacing:0.5px;
    margin:0;
    color:var(--accent-light);
    text-shadow:0 0 18px rgba(255,209,102,0.35);
  }
  .scoreboard .sub{font-size:12px;color:var(--text-dim);font-family:var(--font-mono);letter-spacing:1px;text-transform:uppercase;}
  .role-toggle{display:flex;gap:8px;z-index:1;}
  .role-btn{
    font-family:var(--font-mono);font-size:13px;letter-spacing:0.5px;
    padding:9px 16px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg-panel);color:var(--text-dim);cursor:pointer;
    transition:all .15s ease;
  }
  .role-btn.active{background:var(--accent-red);color:#fff;border-color:var(--accent-red);}
  .role-btn:hover{border-color:var(--accent-light);}

  /* ---- generic panel ---- */
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    margin-top:16px;
  }
  .panel h2{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0 0 14px;color:var(--text-chalk);letter-spacing:0.3px;}
  .panel h2 .eyebrow{display:block;font-family:var(--font-mono);font-size:11px;color:var(--accent-green);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}

  .btn{
    font-family:var(--font-body);font-weight:500;font-size:14px;
    padding:10px 18px;border-radius:8px;border:none;cursor:pointer;
    background:var(--accent-red);color:#fff;transition:transform .1s ease, filter .15s ease;
  }
  .btn:hover{filter:brightness(1.1);}
  .btn:active{transform:scale(0.97);}
  .btn:disabled{background:#3A4A6B;color:var(--text-dim);cursor:not-allowed;}
  .btn.secondary{background:var(--bg-panel-2);color:var(--text-chalk);border:1px solid var(--line);}
  .btn.gold{background:var(--accent-light);color:#3A2400;}
  .btn.small{padding:6px 12px;font-size:12px;}

  input[type=text], input[type=number], select, textarea{
    background:var(--bg-deep);border:1px solid var(--line);color:var(--text-chalk);
    padding:9px 12px;border-radius:8px;font-family:var(--font-body);font-size:14px;width:100%;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent-green);border-color:transparent;}
  label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:5px;}

  /* ---- tabs (coach) ---- */
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{
    font-family:var(--font-mono);font-size:12px;padding:8px 14px;border-radius:20px;
    background:var(--bg-panel-2);color:var(--text-dim);cursor:pointer;border:1px solid var(--line);
  }
  .tab.active{background:var(--accent-green);color:#04231f;border-color:var(--accent-green);}

  /* ---- player picker ---- */
  .player-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
  .player-chip{
    background:var(--bg-panel-2);border:1px solid var(--line);border-radius:10px;
    padding:12px 16px;cursor:pointer;text-align:left;min-width:120px;
    transition:border-color .15s ease;
  }
  .player-chip:hover{border-color:var(--accent-light);}
  .player-chip .name{font-weight:700;font-size:15px;}
  .player-chip .lv{font-family:var(--font-mono);font-size:11px;color:var(--accent-light);}

  /* ---- monster battle ---- */
  .battle-card{
    background:radial-gradient(ellipse at 50% 0%, rgba(228,87,46,0.28), transparent 65%), var(--bg-panel-2);
    border:1px solid var(--accent-red);border-radius:14px;padding:22px;text-align:center;position:relative;
  }
  .monster-emoji{font-size:64px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 0 14px rgba(228,87,46,0.45));}
  .monster-emoji.shake{animation:shake .35s ease;}
  .boss-emoji{font-size:88px;filter:drop-shadow(0 0 28px rgba(228,87,46,0.7)) drop-shadow(0 0 10px rgba(255,80,20,0.5));animation:bossPulse 2.2s ease-in-out infinite;}
  @keyframes bossPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  @keyframes shake{
    0%,100%{transform:translate(0,0) rotate(0);}
    20%{transform:translate(-6px,2px) rotate(-4deg);}
    40%{transform:translate(5px,-2px) rotate(3deg);}
    60%{transform:translate(-4px,1px) rotate(-2deg);}
    80%{transform:translate(3px,0) rotate(2deg);}
  }
  .monster-name{font-family:var(--font-display);font-size:22px;color:var(--accent-light);letter-spacing:0.5px;}
  .hp-bar-outer{background:var(--bg-deep);border:1px solid var(--line);border-radius:20px;height:16px;overflow:hidden;margin:10px auto;max-width:340px;}
  .hp-bar-inner{height:100%;background:linear-gradient(90deg,var(--accent-red),#ff8a5c);transition:width .4s ease;}
  .hp-text{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
  .energy-row{display:flex;justify-content:center;gap:18px;margin-top:14px;font-family:var(--font-mono);font-size:13px;color:var(--text-dim);}
  .energy-row b{color:var(--accent-light);font-size:16px;}

  /* ---- stat cards ---- */
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .stat-card{flex:1;min-width:100px;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
  .stat-card .v{font-family:var(--font-display);font-size:26px;color:var(--accent-light);}
  .stat-card .l{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;}

  /* ---- items checklist ---- */
  .item-list{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
  .item-row{
    display:flex;align-items:center;gap:10px;background:var(--bg-deep);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;
  }
  .item-row input{width:auto;}
  .item-row .xp-tag{margin-left:auto;font-family:var(--font-mono);color:var(--accent-green);font-size:12px;}
  .item-row.done{opacity:0.45;}

  /* ---- table (coach overview) ---- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;text-align:left;padding:8px;border-bottom:1px solid var(--line);}
  td{padding:9px 8px;border-bottom:1px solid var(--line);}
  tr:hover td{background:rgba(255,255,255,0.02);}

  .row-flex{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .row-flex > div{flex:1;min-width:140px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--bg-panel-2);border:1px solid var(--accent-light);color:var(--text-chalk);
    padding:12px 22px;border-radius:10px;font-size:14px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,0.4);
    animation:fadein .2s ease;
  }
  @keyframes fadein{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

  .modal-bg{position:fixed;inset:0;background:rgba(5,10,20,0.7);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;}
  .modal{background:var(--bg-panel);border:1px solid var(--accent-light);border-radius:14px;padding:24px;max-width:420px;width:100%;}
  .modal h3{font-family:var(--font-display);font-size:22px;margin:0 0 14px;color:var(--accent-light);}
  .opt-btn{
    display:block;width:100%;text-align:left;background:var(--bg-panel-2);border:1px solid var(--line);
    color:var(--text-chalk);padding:11px 14px;border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:14px;
  }
  .opt-btn:hover{border-color:var(--accent-light);}
  .opt-btn.correct{background:rgba(42,157,143,0.25);border-color:var(--accent-green);}
  .opt-btn.wrong{background:rgba(228,87,46,0.25);border-color:var(--accent-red);}
  .opt-btn:disabled{cursor:default;}

  /* ---- mini battle animation ---- */
  .mini-battle{display:flex;align-items:center;justify-content:center;gap:28px;margin:18px 0 6px;position:relative;height:64px;}
  .mini-battle .attacker{font-size:38px;transform-origin:70% 70%;}
  .mini-battle .boss-target{font-size:46px;position:relative;}
  .mini-battle .impact{font-size:32px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);opacity:0;}
  .mini-battle .dmg-float{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-family:var(--font-display);font-size:22px;color:var(--accent-red);opacity:0;white-space:nowrap;}
  .mini-battle.dodge .dmg-float{color:var(--accent-light);}
  .mini-battle.hit .attacker{animation:swingHit .5s ease;}
  .mini-battle.hit .impact{animation:impactPop .6s ease .22s forwards;}
  .mini-battle.hit .boss-target{animation:bossHit .4s ease .35s;}
  .mini-battle.hit .dmg-float{animation:dmgFloat 1s ease .3s forwards;}
  .mini-battle.dodge .attacker{animation:swingHit .5s ease;}
  .mini-battle.dodge .impact{animation:impactPop .5s ease .2s forwards;}
  .mini-battle.dodge .boss-target{animation:bossDodge .55s ease .3s;}
  .mini-battle.dodge .dmg-float{animation:dmgFloat 1s ease .35s forwards;}
  .mini-battle.miss .attacker{animation:swingMiss .5s ease;}
  .mini-battle.miss .impact{animation:missPop .5s ease .15s forwards;}
  @keyframes swingHit{0%{transform:rotate(0);}35%{transform:rotate(-30deg) translateX(-8px);}70%{transform:rotate(40deg) translateX(12px);}100%{transform:rotate(0);}}
  @keyframes swingMiss{0%{transform:rotate(0);}50%{transform:rotate(-18deg);}100%{transform:rotate(8deg);}}
  @keyframes impactPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0;}45%{transform:translate(-50%,-50%) scale(1.4);opacity:1;}100%{transform:translate(-50%,-50%) scale(0.9);opacity:0;}}
  @keyframes missPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0;}50%{transform:translate(-50%,-50%) scale(1.1);opacity:0.8;}100%{transform:translate(-50%,-50%) scale(0.8);opacity:0;}}
  @keyframes bossHit{0%,100%{transform:translateX(0) rotate(0);}30%{transform:translateX(10px) rotate(6deg);}60%{transform:translateX(-8px) rotate(-4deg);}}
  @keyframes bossDodge{0%{transform:translateX(0);}40%{transform:translateX(-34px) scale(0.9);}70%{transform:translateX(8px);}100%{transform:translateX(0);}}
  @keyframes dmgFloat{0%{opacity:0;transform:translate(-50%,0);}25%{opacity:1;}100%{opacity:0;transform:translate(-50%,-32px);}}

  .empty{color:var(--text-dim);font-size:13px;padding:14px 0;text-align:center;}
  .small-note{font-size:11px;color:var(--text-dim);margin-top:6px;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
</style>
</head>

<script>
/* ============ 資料存取層（Firebase Firestore） ============ */
const FS_COLLECTION = 'gameData'; // 所有資料存在這個 collection 裡，每筆資料一個文件

async function dbGet(key){
  const snap = await fbDb.collection(FS_COLLECTION).doc(key).get();
  if(!snap.exists) throw new Error('not found: '+key);
  return snap.data().value;
}
async function dbSet(key, value){
  await fbDb.collection(FS_COLLECTION).doc(key).set({ value, updatedAt: Date.now() });
}
async function dbDelete(key){
  await fbDb.collection(FS_COLLECTION).doc(key).delete();
}
async function dbListPrefix(prefix){
  const snap = await fbDb.collection(FS_COLLECTION)
    .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
    .where(firebase.firestore.FieldPath.documentId(), '<', prefix+'\uf8ff')
    .get();
  return snap.docs.map(d => d.id.slice(prefix.length));

async function getConfig(){
  try{
    const value = await dbGet('config');
    const parsed = JSON.parse(value);
    // 補上舊版資料可能缺少的欄位，避免功能因為缺欄位而失效
    if(!parsed.bonusTasks) parsed.bonusTasks = [];
    if(!parsed.shopItems) parsed.shopItems = [];
    if(parsed.penaltyPoints==null) parsed.penaltyPoints = 30;
    if(parsed.bossDodgeChance==null) parsed.bossDodgeChance = 0.2;
    if(!parsed.bossRoster || !parsed.bossRoster.length) parsed.bossRoster = DEFAULT_BOSS_ROSTER.slice();
    if(!parsed.formUrl) parsed.formUrl = '';
    if(parsed.coachPassword==null) parsed.coachPassword = '';
    (parsed.items||[]).forEach(it=>{
      if(it.subOptions==null) it.subOptions = [];
      it.subOptions = it.subOptions.map(o=> typeof o==='string' ? {label:o, xp:5} : o);
      if(it.required==null) it.required = false;
      if(it.requireVideo==null) it.requireVideo = false;
    });
    (parsed.questions||[]).forEach(q=>{ if(q.subTag===undefined) q.subTag = null; });
    return parsed;
  }catch(e){
    const def = buildDefaultConfig();
    await dbSet('config', JSON.stringify(def));
    return def;
  }
}

async function importExamQuestions(){
  const examDefaults = buildDefaultConfig().questions.filter(q=>q.id.startsWith('exam_'));
  const existingIds = new Set(state.config.questions.map(q=>q.id));
  const newOnes = examDefaults.filter(q=>!existingIds.has(q.id));
  if(newOnes.length===0){ showToast('這些題目已經在題庫裡了'); return; }
  state.config.questions = state.config.questions.concat(newOnes);
  await saveConfig(state.config);

function bossTemplateAt(idx){
  const roster = (state.config && state.config.bossRoster && state.config.bossRoster.length) ? state.config.bossRoster : DEFAULT_BOSS_ROSTER;
  return roster[((idx%roster.length)+roster.length)%roster.length];
}
function bossMaxHP(bossNumber){ return 500 + (bossNumber-1)*300; }
async function getTeamBoss(){
  try{
    const value = await dbGet('teamBoss');
    const b = JSON.parse(value);
    if(!b.emoji || !b.templateId){
      const tpl = bossTemplateAt((b.bossNumber||1)-1);
      b.templateId = tpl.id;
      b.emoji = tpl.emoji;
      b.quote = tpl.quote;
      if(!b.name) b.name = tpl.name;
    }
    return b;
  }catch(e){
    const tpl = bossTemplateAt(0);
    const boss = { bossNumber:1, templateId:tpl.id, name:tpl.name, emoji:tpl.emoji, quote:tpl.quote, hp:bossMaxHP(1), maxHp:bossMaxHP(1), kills:[] };
    await dbSet('teamBoss', JSON.stringify(boss));
    return boss;
  }
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function daysBetween(a,b){
  const da = new Date(a), db = new Date(b);
  return Math.round((db-da)/86400000);
}
function logItemName(it){ return typeof it==='string' ? it : it.name; }
function logItemDetail(it){ return (typeof it==='object' && it.detail) ? it.detail : ''; }
function logItemsDisplay(log){
  return (log.items||[]).map(it=>{
    const n = logItemName(it), d = logItemDetail(it);
    return d ? (n+'（'+d+'）') : n;
  }).join('、');
}
function computeItemEnergy(it){
  if(it.subOptions && it.subOptions.length){
    const d = subDraft[it.id] || {picks:{}, custom:''};
    return it.subOptions.reduce((s,opt)=> s + (d.picks[opt.label] ? (Number(opt.xp)||0) : 0), 0);
  }
  return it.xp;
}

  await savePlayer(p);

  state.newPlayerName = '';
  state.newPlayerRealName = '';
  await selectPlayer(name);
}

}

  const chosen = state.config.items.filter(it=>checklistDraft[it.id] && !doneToday.has(it.name));
  if(chosen.length===0){ showToast('至少勾選一項今天還沒完成的練習'); return; }
  const missingRequired = state.config.items.filter(it=>it.required && !doneToday.has(it.name) && !checklistDraft[it.id]);
  if(missingRequired.length){
    showToast('尚未完成每日任務：'+missingRequired.map(i=>i.name).join('、'));
    return;
  }
  // 檢查有內容選項的項目，是否至少選了一項內容
  for(const it of chosen){
    if(it.subOptions && it.subOptions.length){
      const d = subDraft[it.id] || {picks:{}, custom:''};
      const anyPicked = Object.values(d.picks).some(Boolean);
      if(!anyPicked){ showToast('「'+it.name+'」請至少選擇一項內容'); return; }
      const usesCustom = d.picks['自訂內容'];
      if(usesCustom && !d.custom.trim()){ showToast('「'+it.name+'」的自訂內容請填寫說明'); return; }
    }
  }
  const needsVideo = chosen.some(it=>it.requireVideo);
  if(needsVideo && !state.videoUploadedDraft){
    showToast('此任務需要上傳證明（照片／影片），請先上傳並勾選「已上傳今天的證明」');
    return;
  }
  const xpSum = chosen.reduce((s,it)=>s+computeItemEnergy(it),0);
  p.energy += xpSum;
  const isNewDay = p.lastDate !== today;
  if(isNewDay){
    if(p.lastDate && daysBetween(p.lastDate, today)===1){ p.streak += 1; }
    else { p.streak = 1; }
    p.lastDate = today;
  }
  const videoDone = !!state.videoUploadedDraft;
  const itemsForLog = chosen.map(it=>{
    let detail = '';
    if(it.subOptions && it.subOptions.length){
      const d = subDraft[it.id] || {picks:{}, custom:''};
      const labels = Object.keys(d.picks).filter(k=>d.picks[k] && k!=='自訂內容').concat(d.picks['自訂內容']?[d.custom.trim()]:[]);
      detail = labels.join('、');
    }
    return {name: it.name, detail};
  });
  p.log.unshift({
    date:today, items:itemsForLog, xp:xpSum,
    video:videoDone, needsReview:needsVideo,
    reviewStatus: needsVideo ? 'pending' : 'approved'
  });
  p.log = p.log.slice(0,20);
  await savePlayer(p);
  checklistDraft = {};
  subDraft = {};
  state.videoUploadedDraft = false;
  showToast('練習已記錄！獲得 '+xpSum+' 點能量 ⚡'+(needsVideo?'，等待教練審核':''));
  render();
}

function todayItemDetails(p){
  const today = todayStr();
  const map = {}; // itemName -> Set of detail 細項 labels (空字串代表沒有內容選項也已完成)
  p.log.filter(l=>l.date===today).forEach(l=>{
    (l.items||[]).forEach(it=>{
      const name = logItemName(it);
      const detail = logItemDetail(it);
      if(!map[name]) map[name] = new Set();
      if(detail){
        detail.split('、').forEach(d=>{ if(d.trim()) map[name].add(d.trim()); });
      } else {
        map[name].add('');
      }
    });
  });
  return map;
}

function pickQuestion(){
  const qs = state.config.questions;
  if(qs.length===0) return null;
  const detailMap = todayItemDetails(state.playerData);
  const doneNames = Object.keys(detailMap);
  let pool = qs;
  if(doneNames.length){
    // 優先：題目指定了內容選項細項，且今天剛好做了那個細項
    const subTagPool = qs.filter(q=>{
      if(!q.subTag) return false;
      const item = state.config.items.find(it=>it.id===q.tag);
      if(!item) return false;
      const details = detailMap[item.name];
      return details && details.has(q.subTag);
    });
    if(subTagPool.length){
      pool = subTagPool;
    } else {
      // 其次：題目只對應到整個項目（沒有指定細項），且今天有做這個項目
      const tagPool = qs.filter(q=>{
        if(q.subTag) return false;
        const item = state.config.items.find(it=>it.id===q.tag);
        return item && doneNames.includes(item.name);
      });
      if(tagPool.length) pool = tagPool;
    }
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

function openAttack(){
  const p = state.playerData;
  if(p.energy<=0){ showToast('能量不足，先完成今日練習吧！'); return; }
  const q = pickQuestion();
  if(!q){ showToast('教練還沒有新增題目喔'); return; }
  state.quiz = { q, selectedIdx:null, result:null };
  render();
}

async function answerQuiz(idx){
  if(state.quiz.selectedIdx!==null) return;
  const p = state.playerData;
  const q = state.quiz.q;
  const isCorrect = idx===q.correct;
  const dodgeChance = state.config.bossDodgeChance!=null ? state.config.bossDodgeChance : 0.2;
  const dodged = isCorrect && (Math.random()<dodgeChance);
  state.quiz.selectedIdx = idx;
  state.quiz.result = isCorrect ? 'correct' : 'wrong';
  state.quiz.dodged = dodged;
  render();

  p.energy = Math.max(0, p.energy-1);
  let bossDefeated = false;
  if(isCorrect){
    p.correct += 1;
    p.points += 5;
    const newLevel = Math.floor(p.correct/5)+1;
    if(newLevel>p.level) p.level = newLevel;

    if(!dodged){
      const boss = await getTeamBoss();
      boss.hp = Math.max(0, boss.hp-20);
      if(boss.hp<=0){
        bossDefeated = true;
        p.points += 80;
        const newBossNumber = boss.bossNumber+1;
        const tpl = bossTemplateAt(newBossNumber-1);
        boss.bossNumber = newBossNumber;
        boss.templateId = tpl.id;
        boss.name = tpl.name;
        boss.emoji = tpl.emoji;
        boss.quote = tpl.quote;
        boss.maxHp = bossMaxHP(newBossNumber);
        boss.hp = boss.maxHp;
        boss.kills = boss.kills || [];
        boss.kills.unshift({date:todayStr(), by:p.name});
        boss.kills = boss.kills.slice(0,10);
      }
      await saveTeamBoss(boss);
      state.teamBoss = boss;
    }
  } else {
    p.wrong += 1;
  }
  await savePlayer(p);

  setTimeout(()=>{
    state.quiz = null;
    render();
    if(bossDefeated) showToast('🎉 全隊擊敗了 Boss！新的「'+(state.teamBoss?state.teamBoss.name:'Boss')+'」已經出現，血量更高了！你獲得最後一擊獎勵 +80 點數！');
    else if(isCorrect && dodged) showToast('💨 答對了！但 Boss 閃過了這次攻擊，沒有造成傷害（+5 點數）');
    else if(isCorrect) showToast('答對了！對 Boss 造成傷害，+5 點數');
    else showToast('答錯了，沒有造成傷害');
  }, 1800);
}

async function reviewLog(name, index, decision){
  const p = await getPlayer(name);
  const entry = p.log[index];
  if(!entry || entry.reviewStatus!=='pending'){ return; }
  if(decision==='approve'){
    entry.reviewStatus = 'approved';
    await savePlayer(p);
    showToast('已通過審核');
  } else {
    const penalty = state.config.penaltyPoints!=null ? state.config.penaltyPoints : 30;
    p.points = Math.max(0, p.points-penalty);
    entry.reviewStatus = 'rejected';
    entry.penalty = penalty;
    await savePlayer(p);
    showToast('已判定造假，扣 '+penalty+' 點');
  }
  state.viewingPlayer = p;
  render();
  refreshOverview();
}

function render(){
  const app = document.getElementById('app');
  if(state.loading){ app.innerHTML = '<div class="empty">載入中...</div>'; return; }
  if(state.role==='coach' && !state.coachUnlocked){ state.role = 'player'; }

  const showCoachEntry = state.coachUnlocked || (window.location.hash.replace('#','')===COACH_ENTRY_HASH);

  let html = '';
  html += `
  <div class="scoreboard">
    <div>
      <div class="sub">Daily Training Arena</div>

        <button class="role-btn ${state.role==='player'?'active':''}" onclick="setRole('player')">球員模式</button>

  }).join('') || '<tr><td colspan=4 class="empty">尚無練習紀錄</td></tr>';

  const invRows = (p.inventory||[]).slice(0,15).map(inv=>{

    else if(inv.status==='scheduled') statusText = `<span style="color:var(--accent-light);">已排定：${esc(inv.useDate)}</span>`;
    else statusText = '<span style="color:var(--accent-green);">未使用</span>';
    return `<tr><td>${esc(inv.itemName)}</td><td>${esc(inv.purchaseDate)}</td><td>-${inv.cost}</td><td>${statusText}</td></tr>`;
  }).join('') || '<tr><td colspan=4 class="empty">物品欄是空的</td></tr>';
  return `
  <div class="modal-bg" onclick="if(event.target===this) closePlayerLog()">
    <div class="modal" style="max-width:600px;max-height:85vh;overflow-y:auto;">
      <h3>📋 ${esc(p.name)} 的練習紀錄</h3>
      <table><thead><tr><th>日期</th><th>項目</th><th>能量</th><th>審核／證明</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <h3 style="margin-top:18px;font-size:18px;">🎁 額外任務紀錄</h3>
      <table><thead><tr><th>日期</th><th>任務</th><th>點數</th></tr></thead>
      <tbody>${bonusRows}</tbody></table>
      <h3 style="margin-top:18px;font-size:18px;">🎒 物品欄／兌換紀錄</h3>
      <table><thead><tr><th>商品</th><th>兌換日</th><th>花費</th><th>狀態</th></tr></thead>
      <tbody>${invRows}</tbody></table>
      <div style="margin-top:14px;text-align:right;">
        <button class="btn secondary small" onclick="closePlayerLog()">關閉</button>
      </div>
    </div>
  </div>`;
}

function renderPlayerRole(){
  if(!state.currentPlayer){
    let chips = state.players.map(n=>{
      return `<div class="player-chip" onclick="selectPlayer('${esc(n)}')">
        <div class="name">${esc(n)}</div>

      <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(11,22,38,0) 40%, rgba(11,22,38,0.92) 100%);"></div>

        <div>

        </div>
        <div>
          <label>本名（一定要填，教練才知道是你，兌獎才對得到人）</label>
          <input type="text" value="${esc(state.newPlayerRealName)}" oninput="state.newPlayerRealName=this.value" placeholder="例如：王小明">

      </div>

  const hpPct = Math.max(0, Math.round(boss.hp/boss.maxHp*100));
  const acc = (p.correct+p.wrong)>0 ? Math.round(p.correct/(p.correct+p.wrong)*100) : 0;
  const doneToday = doneNamesToday(p);
  const allDoneToday = state.config.items.length>0 && state.config.items.every(it=>doneToday.has(it.name));

  let itemRows = state.config.items.map(it=>{
    const alreadyDone = doneToday.has(it.name);
    const checked = !!checklistDraft[it.id];
    const hasSubOptions = it.subOptions && it.subOptions.length>0;

    let subHtml = '';
    if(!alreadyDone && checked && hasSubOptions){
      const d = subDraft[it.id] || {picks:{}, custom:''};
      const subRows = it.subOptions.map(opt=>{
        const isCustom = opt.label==='自訂內容';

        let row = `<div class="item-row" style="background:var(--bg-panel-2);padding:8px 10px;" onclick="event.stopPropagation();toggleSubOption('${it.id}','${esc(opt.label)}')">

      }).join('');
      const previewTotal = computeItemEnergy(it);
      subHtml = `<div style="margin:4px 0 4px 24px;display:flex;flex-direction:column;gap:6px;">${subRows}<div class="small-note">目前選擇共 +${previewTotal} 能量</div></div>`;
    }
    const xpTag = hasSubOptions ? '依內容選項加總' : `+${it.xp} 能量`;
    return `<div>
      <div class="item-row ${alreadyDone?'done':''}" onclick="${alreadyDone?'':`toggleItem('${it.id}')`}">
        <input type="checkbox" ${(checked||alreadyDone)?'checked':''} ${alreadyDone?'disabled':''} onclick="event.stopPropagation()" onchange="toggleItem('${it.id}')">
        <span>${esc(it.name)}${badges}</span>
        <span class="xp-tag">${xpTag}</span>
      </div>
      ${subHtml}
    </div>`;
  }).join('');

  let logRows = p.log.slice(0,5).map(l=>{
    let statusLine = '';
    if(l.needsReview){
      if(l.reviewStatus==='pending') statusLine = ' · <span style="color:var(--accent-light);">⏳ 待教練審核</span>';
      else if(l.reviewStatus==='approved') statusLine = ' · <span style="color:var(--accent-green);">✅ 已通過審核</span>';
      else if(l.reviewStatus==='rejected') statusLine = ` · <span style="color:var(--accent-red);">🚫 判定造假，已扣 ${l.penalty||0} 點</span>`;
    } else if(l.video===true){
      statusLine = ' · <span style="color:var(--accent-green);">✅ 已上傳證明</span>';
    } else if(typeof l.video==='string' && l.video){
      statusLine = ` · <a href="${esc(l.video)}" target="_blank" rel="noopener" style="color:var(--accent-light);">▶ 查看影片</a>`;
    }
    return `<div class="small-note">${esc(l.date)} · ${esc(logItemsDisplay(l))} · +${l.xp}能量${statusLine}</div>`;
  }).join('') || '<div class="empty">尚無紀錄</div>';

  const bonusTasks = state.config.bonusTasks || [];
  let bonusRows = bonusTasks.map(t=>`
    <div class="item-row" style="cursor:default;">
      <span>${esc(t.name)}</span>
      <span class="xp-tag">+${t.points} 點數</span>
      <button class="btn secondary small" onclick="completeBonusTask('${t.id}')" style="margin-left:10px;">✅ 完成一次</button>
    </div>`).join('') || '<div class="empty">教練尚未設定額外任務</div>';
  let bonusHistory = (p.bonusLog||[]).slice(0,5).map(b=>`<div class="small-note">${esc(b.date)} · ${esc(b.name)} · +${b.points}點</div>`).join('');

  const shopItems = state.config.shopItems || [];
  const minDate = (()=>{ const d=new Date(); d.setDate(d.getDate()+1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })();
  let shopRows = shopItems.map(it=>{
    const canAfford = p.points>=it.cost;
    const dateInput = it.advanceNotice ? `<div style="margin-top:6px;"><input type="date" min="${minDate}" value="${esc((state.shopDateDraft&&state.shopDateDraft[it.id])||'')}" oninput="if(!state.shopDateDraft)state.shopDateDraft={};state.shopDateDraft['${it.id}']=this.value" style="max-width:170px;display:inline-block;"></div>` : '';
    return `<div class="item-row" style="cursor:default;flex-direction:column;align-items:stretch;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span>${esc(it.name)}</span>
        <span class="xp-tag">${it.cost} 點</span>
        <button class="btn ${canAfford?'gold':'secondary'} small" ${canAfford?'':'disabled'} onclick="buyShopItem('${it.id}')" style="margin-left:auto;">兌換</button>
      </div>
      ${it.desc?`<div class="small-note">${esc(it.desc)}</div>`:''}
      ${dateInput}
    </div>`;
  }).join('') || '<div class="empty">教練尚未上架任何商品</div>';

  const invStatusLabel = (inv)=>{
    if(inv.status==='used') return `<span style="color:var(--accent-dim,var(--text-dim));">已使用（${esc(inv.usedAt)}）</span>`;
    if(inv.status==='scheduled') return `<span style="color:var(--accent-light);">已排定：${esc(inv.useDate)}</span>`;
    return `<span style="color:var(--accent-green);">未使用</span>`;
  };
  let inventoryRows = (p.inventory||[]).map(inv=>`
    <div class="item-row" style="cursor:default;">
      <span>${esc(inv.itemName)}</span>
      <span class="small-note" style="margin-left:8px;">${invStatusLabel(inv)}</span>
      ${inv.status==='unused' ? `<button class="btn secondary small" onclick="useInventoryItem('${inv.id}')" style="margin-left:auto;">標記已使用</button>` : ''}
    </div>`).join('') || '<div class="empty">物品欄是空的，去商店兌換點東西吧！</div>';

  return `
  <div class="panel">
    <div class="flex-between">
      <h2 style="margin:0;"><span class="eyebrow">Player</span>${esc(p.name)} 的競技場</h2>
      <button class="btn secondary small" onclick="backToPicker()">切換球員</button>
    </div>
    <div class="small-note">🪪 暱稱／ID：${esc(p.name)} ・ 本名：${esc(p.realName||'未填寫')}</div>
    <div class="stat-row">
      <div class="stat-card"><div class="v">Lv.${p.level}</div><div class="l">等級</div></div>
      <div class="stat-card"><div class="v">⚡${p.energy}</div><div class="l">能量</div></div>
      <div class="stat-card"><div class="v">💰${p.points}</div><div class="l">兌換點數</div></div>
      <div class="stat-card"><div class="v">${p.streak}🔥</div><div class="l">連續天數</div></div>
    </div>
  </div>

  <div class="panel">
    <h2><span class="eyebrow">Inventory</span>🎒 我的物品欄</h2>
    <div class="item-list">${inventoryRows}</div>
    <div class="small-note" style="margin-top:8px;">「標記已使用」是給教練參考的紀錄，實際兌換（例如拿手套、請假）還是要跟教練當面確認喔。</div>
  </div>

  <div class="panel battle-card">
    <div class="monster-emoji boss-emoji" id="monsterEmoji">${esc(boss.emoji||'🐉')}</div>
    <div class="monster-name">${esc(boss.name)}（Boss #${boss.bossNumber}）</div>
    <div class="small-note" style="font-style:italic;">${esc(boss.quote||'「膽敢挑戰本座？」')}</div>
    <div class="hp-bar-outer"><div class="hp-bar-inner" style="width:${hpPct}%;"></div></div>
    <div class="hp-text">全隊共同 HP ${boss.hp} / ${boss.maxHp} ・ 你的答對率 ${acc}%</div>
    <div class="energy-row">可用能量 <b>${p.energy}</b> ⚡ ・ 每次攻擊消耗 1 點</div>
    <div style="margin-top:16px;">
      <button class="btn" ${p.energy<=0?'disabled':''} onclick="openAttack()">⚔️ 回答問題並攻擊 Boss</button>
    </div>
    <div class="small-note" style="margin-top:10px;">這隻 Boss 是全隊共同的敵人，大家一起累積傷害，打倒後會出現血量更高的新 Boss！</div>
  </div>

  <div class="panel">
    <h2><span class="eyebrow">Path</span>訓練之路</h2>
    ${allDoneToday ? '<div class="small-note">✅ 今天所有項目都完成囉，明天再來累積能量！</div>' : `
      <div class="item-list">${itemRows}</div>
      ${state.config.formUrl ? `
      <div class="small-note" style="margin-bottom:8px;">若有需要上傳照片／影片證明的項目，請先到這裡上傳：</div>
      <a href="${esc(state.config.formUrl)}" target="_blank" rel="noopener" class="btn secondary" style="display:inline-block;margin-bottom:12px;text-decoration:none;">📎 前往上傳證明</a>
      ` : `<div class="small-note" style="margin-bottom:8px;">教練尚未設定上傳表單</div>`}
      <div class="item-row" onclick="toggleVideoUploaded()">
        <input type="checkbox" ${state.videoUploadedDraft?'checked':''} onclick="event.stopPropagation()" onchange="toggleVideoUploaded()">
        <span>我已經上傳今天的證明（作業／影片）</span>
      </div>
      <div style="height:12px;"></div>
      <button class="btn gold" onclick="submitPractice()">紀錄這次練習</button>
      <div class="small-note" style="margin-top:8px;">同一天可以分次記錄不同的訓練項目，已完成的項目會標示 ✅，不會重複計算能量。</div>
    `}
    <h2 style="margin-top:20px;"><span class="eyebrow">History</span>最近紀錄</h2>
    ${logRows}
  </div>

  <div class="panel">
    <h2><span class="eyebrow">Bonus</span>額外任務</h2>
    <div class="small-note" style="margin-bottom:8px;">完成後直接回報，不限次數，也不影響每日練習紀錄。</div>
    <div class="item-list">${bonusRows}</div>
    ${bonusHistory ? `<h2 style="margin-top:16px;font-size:16px;">最近回報</h2>${bonusHistory}` : ''}
  </div>

  <div class="panel">
    <h2><span class="eyebrow">Shop</span>兌換商店</h2>
    <div class="item-list">${shopRows}</div>
  </div>`;
}

function renderQuizModal(){
  const q = state.quiz.q;
  const sel = state.quiz.selectedIdx;
  let opts = q.options.map((o,i)=>{
    let cls='opt-btn';
    if(sel!==null){
      if(i===q.correct) cls+=' correct';
      else if(i===sel) cls+=' wrong';
    }
    return `<button class="${cls}" ${sel!==null?'disabled':''} onclick="answerQuiz(${i})">${esc(o)}</button>`;
  }).join('');
  let resultLine = '';
  let battleHtml = '';
  if(sel!==null){
    const isCorrect = state.quiz.result==='correct';
    const dodged = !!state.quiz.dodged;
    let battleClass, dmgText, lineHtml;
    if(isCorrect && !dodged){
      battleClass = 'hit';
      dmgText = '-20';
      lineHtml = '<div class="small-note" style="color:var(--accent-green);">✔ 命中！對 Boss 造成傷害！</div>';
    } else if(isCorrect && dodged){
      battleClass = 'dodge';
      dmgText = '閃避！';
      lineHtml = '<div class="small-note" style="color:var(--accent-light);">💨 答對了，但 Boss 閃過了這次攻擊！</div>';
    } else {
      battleClass = 'miss';
      dmgText = '';
      lineHtml = '<div class="small-note" style="color:var(--accent-red);">✘ 答錯了，空揮沒有出手</div>';
    }
    resultLine = lineHtml;
    battleHtml = `
    <div class="mini-battle ${battleClass}">
      <div class="attacker">🏏</div>
      <div class="impact">${battleClass==='hit'?'💥':(battleClass==='dodge'?'💨':'💦')}</div>
      ${dmgText?`<div class="dmg-float">${dmgText}</div>`:''}
      <div class="boss-target">🐉</div>
    </div>`;
  }
  return `
  <div class="modal-bg" onclick="if(event.target===this && ${sel===null}) closeQuiz()">
    <div class="modal">
      <div class="flex-between" style="align-items:flex-start;">
        <h3 style="margin:0;">⚔️ 攻擊挑戰</h3>
        ${sel===null ? '<button class="btn secondary small" onclick="closeQuiz()">✕ 稍後再攻擊</button>' : ''}
      </div>
      <p style="font-size:15px;line-height:1.5;margin-top:10px;">${esc(q.q)}</p>
      ${opts}
      ${battleHtml}
      ${resultLine}
    </div>
  </div>`;
}
function closeQuiz(){
  if(state.quiz && state.quiz.selectedIdx===null){
    state.quiz = null;
    render();
  }
}

      <div style="display:flex;gap:18px;margin-top:10px;flex-wrap:wrap;">

      <div style="margin-top:10px;">
        <label>內容選項（選填，每行一個，格式為「名稱 / 能量值」；學生勾選這個項目時可複選內容，能量會加總。若要讓學生自己填寫，新增一行「自訂內容 / 能量值」）</label>
        <textarea rows="3" oninput="state.addItemDraft.subOptionsText=this.value" placeholder="例如：&#10;伏地挺身 30 下 / 5&#10;仰臥起坐 30 下 / 5&#10;棒式 1 分鐘 / 4">${esc(state.addItemDraft.subOptionsText)}</textarea>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;">
        <button class="btn gold" onclick="addItem()">${state.editingItemId?'更新項目':'新增項目'}</button>
        ${state.editingItemId?'<button class="btn secondary" onclick="cancelEditItem()">取消編輯</button>':''}
      </div>
    </div>
    <div class="panel" style="background:var(--bg-panel-2);margin-top:16px;">
      <h2 style="font-size:18px;"><span class="eyebrow">Proof</span>證明上傳表單與審核扣分設定</h2>
      <div class="small-note" style="margin-bottom:8px;">建立一個 Google 表單（加入「檔案上傳」題目，可上傳照片或影片），把連結貼在這裡，學生會在練習頁看到「前往上傳證明」按鈕，檔案會自動存進你自己的 Google 雲端硬碟。標記「需要照片／影片證明」的任務，學生提交後會顯示「待審核」，你可以到「隊伍總覽 → 查看紀錄」核對，發現亂傳／造假可直接扣點。</div>
      <div class="row-flex">
        <div><label>證明上傳表單連結</label><input type="text" value="${esc(state.formUrlDraft!==null && state.formUrlDraft!==''?state.formUrlDraft:(state.config.formUrl||''))}" oninput="state.formUrlDraft=this.value" placeholder="https://forms.gle/..."></div>
        <div style="max-width:140px;"><label>造假扣點數</label><input type="number" value="${state.penaltyDraft!==null?state.penaltyDraft:(state.config.penaltyPoints!=null?state.config.penaltyPoints:30)}" oninput="state.penaltyDraft=this.value"></div>
        <div style="flex:0;"><button class="btn gold" onclick="saveFormUrl()">儲存</button></div>
      </div>
    </div>
    <div class="panel" style="background:var(--bg-panel-2);margin-top:16px;">
      <h2 style="font-size:18px;"><span class="eyebrow">Reset</span>重設項目與題庫</h2>
      <div class="small-note" style="margin-bottom:8px;">如果畫面上的項目沒有出現「內容選項」，或功能感覺沒更新，通常是因為之前已經儲存過舊版設定。按下面按鈕可以把「練習項目」與「題庫」換成系統最新的預設內容——球員的等級、點數、練習紀錄完全不會受影響。</div>
      <button class="btn secondary" onclick="resetToDefaultConfig()">🔄 重設為最新預設項目與題庫</button>
    </div>
    <div class="panel" style="background:var(--bg-panel-2);margin-top:16px;">
      <h2 style="font-size:18px;"><span class="eyebrow">Security</span>教練密碼</h2>
      <div class="small-note" style="margin-bottom:8px;">忘記密碼或想換一組時可以在這裡直接設定新密碼。網址列輸入 <code>#${COACH_ENTRY_HASH}</code> 才會出現登入入口，這個網址不要分享給學生。</div>
      <div class="row-flex">
        <div><input type="password" value="${esc(state.newCoachPwDraft)}" oninput="state.newCoachPwDraft=this.value" placeholder="設定新密碼"></div>
        <div style="flex:0;"><button class="btn gold" onclick="changeCoachPassword()">更新密碼</button></div>
      </div>
    </div>`;
  } else if(state.coachTab==='shop'){
    let rows = (state.config.shopItems||[]).map(s=>`
      <tr><td>${esc(s.name)}${s.advanceNotice?' <span class="small-note">(需提前告知)</span>':''}${s.desc?`<div class="small-note">${esc(s.desc)}</div>`:''}</td><td>${s.cost}</td><td><button class="btn secondary small" onclick="deleteShopItem('${s.id}')">刪除</button></td></tr>
    `).join('');
    body = `
    <div class="small-note" style="margin-bottom:10px;">學生可以用點數在「兌換商店」買這裡上架的商品，兌換後會出現在他們的「物品欄」。標記「需提前告知」的商品（例如休假卡），學生兌換時必須先選一個不是今天的日期。</div>
    <table><thead><tr><th>商品名稱</th><th>點數</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan=3 class="empty">尚無商品</td></tr>'}</tbody></table>
    <div class="panel" style="background:var(--bg-panel-2);margin-top:14px;">
      <div class="row-flex">
        <div><label>商品名稱</label><input type="text" value="${esc(state.addShopDraft.name)}" oninput="state.addShopDraft.name=this.value" placeholder="例如：飲料卡（不指定）"></div>
        <div style="max-width:120px;"><label>兌換點數</label><input type="number" value="${state.addShopDraft.cost}" oninput="state.addShopDraft.cost=this.value"></div>
      </div>
      <div style="margin-top:10px;">
        <label>說明（選填）</label>
        <input type="text" value="${esc(state.addShopDraft.desc)}" oninput="state.addShopDraft.desc=this.value" placeholder="例如：口味由教練決定">
      </div>
      <label style="display:flex;align-items:center;gap:6px;color:var(--text-chalk);margin-top:10px;"><input type="checkbox" style="width:auto;" ${state.addShopDraft.advanceNotice?'checked':''} onchange="state.addShopDraft.advanceNotice=this.checked">需提前告知日期（不可當日使用，例如休假卡）</label>
      <div style="margin-top:12px;"><button class="btn gold" onclick="addShopItem()">新增商品</button></div>
    </div>`;
  } else if(state.coachTab==='bossroster'){
    const roster = state.config.bossRoster || DEFAULT_BOSS_ROSTER;
    let rows = roster.map(t=>`
      <tr><td>${t.emoji}</td><td>${esc(t.name)}</td><td>${esc(t.quote||'')}</td><td><button class="btn secondary small" onclick="deleteBossTemplate('${t.id}')">刪除</button></td></tr>
    `).join('');
    body = `
    <div class="small-note" style="margin-bottom:10px;">這裡是所有可以出現的 Boss 造型。每次全隊打倒 Boss，會自動換成名冊裡的下一隻；你也可以隨時到「隊伍總覽」用下拉選單手動切換目前的 Boss。</div>
    <table><thead><tr><th>圖示</th><th>名稱</th><th>台詞</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan=4 class="empty">尚無 Boss</td></tr>'}</tbody></table>
    <div class="panel" style="background:var(--bg-panel-2);margin-top:14px;">
      <div class="row-flex">
        <div style="max-width:100px;"><label>圖示（emoji）</label><input type="text" value="${esc(state.addBossDraft.emoji)}" oninput="state.addBossDraft.emoji=this.value" placeholder="🐲"></div>
        <div><label>Boss 名稱</label><input type="text" value="${esc(state.addBossDraft.name)}" oninput="state.addBossDraft.name=this.value" placeholder="例如：狂風巨鷹"></div>
      </div>
      <div style="margin-top:10px;">
        <label>出場台詞（選填）</label>
        <input type="text" value="${esc(state.addBossDraft.quote)}" oninput="state.addBossDraft.quote=this.value" placeholder="例如：「風暴將至，無人可逃！」">
      </div>
      <div style="margin-top:12px;"><button class="btn gold" onclick="addBossTemplate()">新增 Boss</button></div>
    </div>`;
  } else if(state.coachTab==='bonus'){
    let rows = (state.config.bonusTasks||[]).map(t=>`
      <tr><td>${esc(t.name)}</td><td>+${t.points}</td><td><button class="btn secondary small" onclick="deleteBonusTask('${t.id}')">刪除</button></td></tr>
    `).join('');
    body = `
    <div class="small-note" style="margin-bottom:10px;">額外任務不受「每日一次」限制，學生可隨時回報完成，直接獲得點數（不會加能量、不會影響打怪）。</div>
    <table><thead><tr><th>任務名稱</th><th>點數</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan=3 class="empty">尚無額外任務</td></tr>'}</tbody></table>
    <div class="row-flex" style="margin-top:14px;">
      <div><label>任務名稱</label><input type="text" value="${esc(state.addBonusDraft.name)}" oninput="state.addBonusDraft.name=this.value" placeholder="例如：熟讀一本課外書"></div>
      <div style="max-width:120px;"><label>獎勵點數</label><input type="number" value="${state.addBonusDraft.points}" oninput="state.addBonusDraft.points=this.value"></div>
      <div style="flex:0;"><button class="btn gold" onclick="addBonusTask()">新增任務</button></div>
    </div>`;
  } else if(state.coachTab==='questions'){
    let rows = state.config.questions.map(q=>{
      const tagItem = state.config.items.find(it=>it.id===q.tag);
      const tagLabel = tagItem ? (esc(tagItem.name) + (q.subTag?(' › '+esc(q.subTag)):'')) : '不指定';
      return `<tr><td>${esc(q.q)}</td><td>${esc(q.options[q.correct])}</td><td>${tagLabel}</td><td><button class="btn secondary small" onclick="deleteQuestion('${q.id}')">刪除</button></td></tr>`;
    }).join('');
    let itemOptions = state.config.items.map(it=>`<option value="${it.id}" ${state.addQDraft.tag===it.id?'selected':''}>${esc(it.name)}</option>`).join('');
    let optInputs = state.addQDraft.options.map((o,i)=>`
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
        <input type="radio" name="correctOpt" ${state.addQDraft.correct==i?'checked':''} onchange="state.addQDraft.correct=${i}" style="width:auto;">
        <input type="text" value="${esc(o)}" oninput="state.addQDraft.options[${i}]=this.value" placeholder="選項 ${i+1}">
      </div>`).join('');
    const selectedItem = state.config.items.find(it=>it.id===state.addQDraft.tag);
    const subChoices = selectedItem ? (selectedItem.subOptions||[]).map(o=>o.label).filter(l=>l!=='自訂內容') : [];
    let subTagHtml = '';
    if(subChoices.length){
      subTagHtml = `<div><label>對應內容選項（可選，設定後這題只會在學生做這個細項時出現）</label>
        <select onchange="state.addQDraft.subTag=this.value">
          <option value="">不指定（整個項目共用）</option>
          ${subChoices.map(o=>`<option value="${esc(o)}" ${state.addQDraft.subTag===o?'selected':''}>${esc(o)}</option>`).join('')}
        </select>
      </div>`;
    }
    body = `
    <div class="panel" style="background:var(--bg-panel-2);margin-bottom:14px;">
      <div class="small-note" style="margin-bottom:8px;">教練提供的「棒球認知測驗」選擇題（5 題）可以直接匯入題庫，不會動到你原本的項目或其他題目。</div>
      <button class="btn secondary" onclick="importExamQuestions()">📥 匯入棒球認知測驗選擇題</button>
    </div>
    <table><thead><tr><th>題目</th><th>正解</th><th>對應項目</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan=4 class="empty">尚無題目</td></tr>'}</tbody></table>
    <div class="panel" style="background:var(--bg-panel-2);margin-top:14px;">
      <label>題目內容</label>
      <textarea rows="2" oninput="state.addQDraft.q=this.value" placeholder="例如：打擊時重心應該放在？">${esc(state.addQDraft.q)}</textarea>
      <div style="margin-top:10px;">
        <label>四個選項（選擇左側圓點標記正確答案）</label>
        ${optInputs}
      </div>
      <div class="row-flex" style="margin-top:10px;">
        <div><label>對應練習項目（可不指定）</label>
          <select onchange="state.addQDraft.tag=this.value; state.addQDraft.subTag=''; render();">
            <option value="">不指定</option>
            ${itemOptions}
          </select>
        </div>
        ${subTagHtml}
        <div style="flex:0;"><button class="btn gold" onclick="addQuestion()">新增題目</button></div>
      </div>
    </div>`;
  } else {
    if(overviewCache.length===0 && state.players.length>0){ refreshOverview(); }
    const boss = state.teamBoss || {name:'烈焰黑龍', emoji:'🐉', quote:'「膽敢挑戰本座？」', hp:0, maxHp:1, bossNumber:1, kills:[]};
    const bossPct = Math.max(0, Math.round(boss.hp/boss.maxHp*100));
    const bossKills = (boss.kills||[]).slice(0,5).map(k=>`<div class="small-note">${esc(k.date)} · 最後一擊：${esc(k.by)}</div>`).join('');
    let rows = overviewCache.map(p=>{
      const acc = (p.correct+p.wrong)>0 ? Math.round(p.correct/(p.correct+p.wrong)*100) : 0;
      return `<tr>
        <td>${esc(p.name)}</td>
        <td>${esc(p.realName||'—')}</td>
        <td>Lv.${p.level}</td>
        <td>${p.energy}</td>
        <td>${p.points}</td>
        <td>${p.streak}🔥</td>
        <td>${acc}%</td>
        <td style="min-width:210px;">
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <input type="number" placeholder="點數" style="width:70px;" value="${state.redeemDraft[p.name]||''}" oninput="state.redeemDraft['${esc(p.name)}']=this.value">
            <button class="btn secondary small" onclick="redeemPoints('${esc(p.name)}')">兌換</button>
            <button class="btn secondary small" onclick="viewPlayerLog('${esc(p.name)}')">查看紀錄</button>
            <button class="btn secondary small" style="color:var(--accent-red);" onclick="deletePlayer('${esc(p.name)}')">🗑️ 刪除</button>
          </div>
        </td>
      </tr>`;
    }).join('');
    const rosterOptions = (state.config.bossRoster||DEFAULT_BOSS_ROSTER).map(t=>`<option value="${t.id}" ${boss.templateId===t.id?'selected':''}>${t.emoji} ${esc(t.name)}</option>`).join('');
    body = `
    <div class="panel battle-card" style="margin-top:0;">
      <div class="monster-emoji boss-emoji">${esc(boss.emoji||'🐉')}</div>
      <div class="monster-name">${esc(boss.name)}（Boss #${boss.bossNumber}）</div>
      <div class="small-note" style="font-style:italic;">${esc(boss.quote||'')}</div>
      <div class="hp-bar-outer"><div class="hp-bar-inner" style="width:${bossPct}%;"></div></div>
      <div class="hp-text">全隊共同 HP ${boss.hp} / ${boss.maxHp}</div>
      ${bossKills ? `<div style="margin-top:10px;"><div class="small-note" style="font-weight:600;">最近擊殺紀錄</div>${bossKills}</div>` : ''}
      <div class="row-flex" style="margin-top:12px;align-items:flex-end;">
        <div><label>選擇目前 Boss 造型</label>
          <select onchange="applyBossTemplate(this.value)">${rosterOptions}</select>
        </div>
        <div style="max-width:120px;"><label>Boss 閃避機率(%)</label><input type="number" value="${state.bossDodgeDraft!==null?state.bossDodgeDraft:Math.round((state.config.bossDodgeChance!=null?state.config.bossDodgeChance:0.2)*100)}" oninput="state.bossDodgeDraft=this.value"></div>
        <div style="flex:0;"><button class="btn secondary small" onclick="saveBossDodgeChance()">儲存</button></div>
        <div style="flex:0;"><button class="btn secondary small" onclick="resetTeamBoss()">🔄 重置 Boss</button></div>
      </div>
    </div>
    <div class="flex-between" style="margin:14px 0 10px;">
      <div class="small-note">共 ${state.players.length} 位球員 ・ 資料為團隊共享，所有裝置即時同步</div>
      <button class="btn secondary small" onclick="refreshOverview()">重新整理</button>
    </div>
    <table><thead><tr><th>暱稱／ID</th><th>本名</th><th>等級</th><th>能量</th><th>點數</th><th>連續</th><th>正確率</th><th>兌換</th></tr></thead>
    <tbody>${rows || '<tr><td colspan=8 class="empty">尚無球員資料</td></tr>'}</tbody></table>
    <div class="small-note" style="margin-top:12px;">${esc(state.config.rewardNote)}</div>`;
  }

  return `
  <div class="panel">
    <div class="tabs">
      <div class="tab ${state.coachTab==='items'?'active':''}" onclick="setCoachTab('items')">項目管理</div>
      <div class="tab ${state.coachTab==='shop'?'active':''}" onclick="setCoachTab('shop')">商店管理</div>
      <div class="tab ${state.coachTab==='bossroster'?'active':''}" onclick="setCoachTab('bossroster')">Boss 設定</div>
      <div class="tab ${state.coachTab==='bonus'?'active':''}" onclick="setCoachTab('bonus')">額外任務</div>
      <div class="tab ${state.coachTab==='questions'?'active':''}" onclick="setCoachTab('questions')">題庫管理</div>
      <div class="tab ${state.coachTab==='overview'?'active':''}" onclick="setCoachTab('overview')">隊伍總覽</div>
    </div>
    ${body}
  </div>`;
}

function setRole(r){
  if(r==='coach' && !state.coachUnlocked){ openCoachLogin(); return; }
  state.role=r;
  if(r==='coach'){ overviewCache=[]; }
  render();
}
function setCoachTab(t){ state.coachTab=t; if(t==='overview'){ overviewCache=[]; } render(); }

function openCoachLogin(){
  state.showCoachLogin = true;
  state.coachPwDraft = '';
  render();
}
function closeCoachLogin(){
  state.showCoachLogin = false;
  render();
}
async function submitCoachLogin(){
  const pw = state.coachPwDraft || '';
  if(!state.config.coachPassword){
    // 第一次使用，還沒設定過密碼：直接把輸入的內容設為新密碼
    if(!pw.trim()){ showToast('請設定一組教練密碼'); return; }
    state.config.coachPassword = pw;
    await saveConfig(state.config);
    state.coachUnlocked = true;
    state.showCoachLogin = false;
    state.role = 'coach';
    showToast('已設定教練密碼，之後用這組密碼登入教練模式');
    render();
    return;
  }
  if(pw === state.config.coachPassword){
    state.coachUnlocked = true;
    state.showCoachLogin = false;
    state.role = 'coach';
    render();
  } else {
    showToast('密碼不對喔');
  }
}
async function changeCoachPassword(){
  const pw = (state.newCoachPwDraft||'').trim();
  if(!pw){ showToast('請輸入新密碼'); return; }
  state.config.coachPassword = pw;
  await saveConfig(state.config);
  state.newCoachPwDraft = '';
  showToast('教練密碼已更新');
  render();
}

init();
</script>
</body>
</html>
